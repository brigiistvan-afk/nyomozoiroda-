<style>
/* ============================================================
   Nyomozóiroda — közös stílus
   Témák (az ügyfájl "tema" mezője): noir1920 · vadasz · modern · borzongos
   Betűk: felület = a telefon rendszerbetűje · nagy címek = díszbetű · iratok = könyvbetű, írógép, kézírás
   ============================================================ */
:root, html[data-skin="noir1920"]{
  --bg:#15241c; --bg-2:#1d3127; --bg-3:#26402f; --bg-ink:#f7f0de; --bg-muted:#cfc3a6; --bg-line:#3b5444;
  --paper:#fcf7ea; --paper-2:#f2e9d2; --ink:#1b1812; --muted:#5a5142; --line:#d6c7a6;
  --accent:#8a5f1f; --accent-ink:#fffaf0; --accent-soft:#f1dfb6; --stamp:#a3312a; --ok:#2c6a43; --ok-soft:#dcebd9; --hl:#f3dc9c;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-doc:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-type:"Courier Prime", "Courier New", Courier, monospace;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
}
html[data-skin="vadasz"]{
  --bg:#1e2a1b; --bg-2:#283724; --bg-3:#33452e; --bg-ink:#f4efe0; --bg-muted:#c6c8ab; --bg-line:#4a5a41;
  --paper:#f7f2e4; --paper-2:#ece3cb; --ink:#1d1b15; --muted:#575343; --line:#cdbf9f;
  --accent:#7a4c1f; --accent-ink:#fff8ec; --accent-soft:#ecd9b4; --stamp:#8e2b1f; --ok:#36643c; --ok-soft:#dde9d8; --hl:#ead7a0;
  --f-display:"Cormorant Garamond", Garamond, Georgia, serif;
}
html[data-skin="modern"]{
  --bg:#eef1f5; --bg-2:#e2e7ee; --bg-3:#d5dce6; --bg-ink:#111821; --bg-muted:#4d5a69; --bg-line:#c4cdd8;
  --paper:#ffffff; --paper-2:#f3f5f8; --ink:#111821; --muted:#4d5a69; --line:#d7dde5;
  --accent:#1d55b0; --accent-ink:#ffffff; --accent-soft:#dbe6f8; --stamp:#c0392b; --ok:#1e7a4a; --ok-soft:#dcf0e3; --hl:#fff0b3;
  --f-display:"Archivo", system-ui, sans-serif;
}
html[data-skin="borzongos"]{
  --bg:#140f10; --bg-2:#1f1718; --bg-3:#2b2021; --bg-ink:#f1e6da; --bg-muted:#bda998; --bg-line:#433435;
  --paper:#f1e8dc; --paper-2:#e4d7c5; --ink:#1b1312; --muted:#5d4b44; --line:#c6b09a;
  --accent:#8b1e2d; --accent-ink:#fff4ee; --accent-soft:#ecd0c8; --stamp:#8b1e2d; --ok:#3d6b46; --ok-soft:#dde8db; --hl:#ead0a4;
  --f-display:"IM Fell English", Georgia, serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--bg-ink);font-family:var(--f-ui);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400}
h2,h3{font-family:var(--f-ui);font-weight:700}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* ---------- Gombok, mezők ---------- */
.gomb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:13px 20px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;line-height:1.2;text-align:center;text-decoration:none}
.gomb.masod{background:transparent;color:inherit;border-color:currentColor}
.gomb.halk{background:transparent;border-color:transparent;color:inherit;min-height:44px;padding:8px 10px}
.gomb.veszely{background:var(--stamp);border-color:var(--stamp);color:#fff}
.gomb.teljes{width:100%}
.gomb svg{width:20px;height:20px;flex:0 0 20px}
.gomb:disabled{opacity:.45;cursor:not-allowed}
.gomb:active:not(:disabled){transform:translateY(1px)}
.mezo{width:100%;min-height:58px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:#16130e;font-size:20px}
.mezo:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.mezo.kod{font-family:var(--f-type);font-weight:700;letter-spacing:.3em;text-align:center;font-size:30px}
textarea.mezo{min-height:150px;font-size:18px;line-height:1.5}
label.cimke{display:block;font-weight:700;margin:14px 0 6px}

/* ---------- Lap (kártya) ---------- */
.lap{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:12px;min-width:0}
.lap h2{font-size:24px}
.lap h3{font-size:20px}
.lap .halv,.halv{color:var(--muted)}
.kicsi{font-size:15px}
.felirat{font-family:var(--f-ui);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cimke-pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--paper-2);color:var(--muted);white-space:nowrap}
.sor{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sor.szet{justify-content:space-between}
.oszlop{display:flex;flex-direction:column;gap:14px}
.racs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.racs > *{min-width:0}
.ertesites{padding:14px 16px;border-radius:12px;background:var(--hl);color:#2b2112;border:1px solid rgba(0,0,0,.1)}
.ertesites.hiba{background:#f7d9d1;color:#4a1a12}
.ertesites.ok{background:var(--ok-soft);color:#173b20}

/* ============================================================
   IRATOK — telefonon és nyomtatásban
   ============================================================ */
.irat{position:relative;background:#fbf6e8;color:#1f1a12;border:1px solid #cdbf9f;padding:22px 20px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;break-inside:avoid;page-break-inside:avoid;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:var(--f-doc)}
.irat .i-szoveg{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.6}
.irat .i-fej{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-type);font-weight:700;letter-spacing:.14em;font-size:14px;border-bottom:2px solid #1f1a12;padding-bottom:6px}
.irat .i-cim{font-family:var(--f-doc);font-weight:600;font-size:20px;line-height:1.3}
.irat .i-meta{font-family:var(--f-type);font-size:14px;color:#5b4f3a}
.irat .i-azon{position:absolute;top:6px;right:10px;font-family:var(--f-type);font-size:11px;color:#8a7b60}
.irat .i-alairas{font-family:var(--f-hand);font-size:27px;line-height:1.1;align-self:flex-end;margin-top:6px;border-top:1px solid #8a7b60;padding:4px 18px 0}
.irat .i-pecset{position:absolute;right:20px;bottom:24px;width:96px;height:96px;border:3px double rgba(140,30,30,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);pointer-events:none}
.irat .i-pecset span{font-family:var(--f-type);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:rgba(140,30,30,.65);text-align:center;line-height:1.2;padding:8px;text-transform:uppercase}

/* írógépes hatás: a fejléc írógép, a szöveg jól olvasható könyvbetű */
.i-jegyzokonyv,.i-dokumentum{background:#fbf7ec}
.i-jegyzokonyv .i-szoveg,.i-dokumentum .i-szoveg,.i-nyugta .i-szoveg{font-family:var(--f-doc)}
.i-vallomas .i-szoveg{font-style:italic}
.i-tavirat{background:#f2e7c9;border:2px solid #a8915f}
.i-tavirat .i-fej{color:#7a2a1e;border-color:#7a2a1e}
.i-tavirat .i-szoveg{font-family:var(--f-type);font-size:17px;letter-spacing:.04em;background:#fffaf0;padding:10px 12px;border:1px solid #c9b88f}
.i-level{background:#fdf9ef}
.i-level .i-szoveg{font-style:italic;font-size:19px}
.i-level .i-datum{font-style:italic;align-self:flex-end;color:#4b3f2c}
.i-naplo .i-szoveg,.i-feljegyzes .i-szoveg{font-family:var(--f-hand);font-size:27px;line-height:1.25}
.i-naplo .i-datum,.i-feljegyzes .i-datum{font-family:var(--f-hand);font-size:24px;align-self:flex-end}
.i-naplo .i-cim,.i-feljegyzes .i-cim{font-family:var(--f-hand);font-size:28px;font-weight:700}
.i-naplo{background:repeating-linear-gradient(#fbf6e8 0 33px,#c9d3dd 33px 34px);background-color:#fbf6e8;border-left:4px double #b94a3c}
.i-feljegyzes{background:#f7eebf;transform:rotate(-.5deg)}
.i-nyugta{border-style:dashed}
.i-ujsag{background:#efe8d6}
.i-ujsag .i-ujsagfej{font-family:var(--f-type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-bottom:3px double #1f1a12;padding-bottom:6px}
.i-ujsag .i-ujsagcim{font-family:var(--f-display);font-size:28px;line-height:1.15}
.i-ujsag .i-szoveg{font-size:17px;column-width:240px;column-gap:20px;text-align:justify;hyphens:auto}
.i-fenykep{background:#fdfbf5;padding:14px 14px 18px}
.i-fenykep .i-foto{border:1px solid #b9a77f}
.i-fenykep .i-foto svg,.i-fenykep .i-foto img,.i-helyszinrajz .i-foto svg{display:block;width:100%;height:auto}
.i-fenykep .i-felirat{font-family:var(--f-hand);font-size:26px;line-height:1.2;text-align:center}
.i-fenykep .i-hatul{font-size:17px;color:#4b3f2c;border-top:1px dashed #b9a77f;padding-top:8px;font-style:italic}
.i-helyszinrajz .rajz svg{display:block;width:100%;height:auto;border:1px solid #b9a77f}
.i-helyszinrajz .jelmagy{margin:8px 0 0;padding-left:0;list-style:none;font-size:16px;display:grid;gap:4px}
.i-egett{border:none;-webkit-mask-image:radial-gradient(130% 130% at 50% 45%,#000 60%,transparent 78%);mask-image:radial-gradient(130% 130% at 50% 45%,#000 60%,transparent 78%);background:radial-gradient(120% 120% at 50% 45%,#fbf6e8 52%,#c79a5c 70%,#3b2410 82%)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<style>
body{min-height:100vh}
/* ---------- Fejléc ---------- */
.fejlec{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bg-line);padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.fejlec .cim{flex:1;min-width:0}
.fejlec .cim b{display:block;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fejlec .cim small{display:block;color:var(--bg-muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ora{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;padding:6px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--bg-line)}
.ora b{font-family:var(--f-type);font-size:22px;font-variant-numeric:tabular-nums;color:var(--hl)}
.ora small{font-size:11px;color:var(--bg-muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.ora.vege b{color:#ff9a8a}
.menugomb{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;border:1px solid var(--bg-line);background:var(--bg-2);color:var(--bg-ink)}
.menugomb svg{width:24px;height:24px}

.oldal{max-width:680px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 116px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

/* ---------- Alsó menü ---------- */
.alsomenu{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-2);border-top:1px solid var(--bg-line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.alsomenu button{position:relative;border:0;background:transparent;color:var(--bg-muted);min-height:60px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px}
.alsomenu button svg{width:26px;height:26px}
.alsomenu button[aria-current="page"]{color:var(--bg-ink);background:var(--bg-3)}
.alsomenu .jelzo{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--stamp);color:#fff;font-size:12px;font-weight:700;line-height:20px;padding:0 6px}

/* ---------- Feladatok ---------- */
.fokartya{background:var(--hl);color:#211809;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.fokartya .felirat{color:#6b4c12}
.fokartya h2{font-size:23px;line-height:1.2}
.fokartya p{font-size:17px}
.fokartya .gomb{background:#211809;border-color:#211809;color:#fff7e3}
.halado{display:flex;flex-direction:column;gap:8px;padding:2px 2px 0}
.halado .sor{justify-content:space-between;color:var(--bg-muted);font-size:15px}
.halado .sor b{color:var(--bg-ink)}
.savok{height:8px;border-radius:4px;background:var(--bg-3);overflow:hidden}
.savok i{display:block;height:100%;background:var(--hl);border-radius:4px}
.szakasz{font-size:15px;font-weight:700;color:var(--bg-muted);margin:10px 2px -2px;display:flex;justify-content:space-between;align-items:baseline}
.tetel{width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border:0;border-radius:16px;padding:14px 14px 14px 12px;min-height:78px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tetel .jel{flex:0 0 46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:16px}
.tetel .jel svg{width:24px;height:24px}
.tetel.lada .jel{background:var(--accent);color:var(--accent-ink)}
.tetel .szoveg{flex:1;min-width:0}
.tetel strong{display:block;font-size:19px;line-height:1.25}
.tetel small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.tetel .nyil{color:var(--muted)}
.tetel .nyil svg{width:22px;height:22px;display:block}
.sorlista{background:var(--bg-2);border:1px solid var(--bg-line);border-radius:16px;overflow:hidden}
.sorlista .s{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--bg-line);color:var(--bg-ink);font-size:16px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.sorlista .s:first-child{border-top:0}
.sorlista .s .ik{flex:0 0 22px;color:var(--bg-muted)}
.sorlista .s .ik svg{width:22px;height:22px;display:block}
.sorlista .s .t{flex:1;min-width:0}
.sorlista .s .t small{display:block;color:var(--bg-muted);font-size:14px}
.sorlista .s .v{font-family:var(--f-type);font-weight:700;color:var(--hl);font-variant-numeric:tabular-nums;white-space:nowrap}
.sorlista .s.kesz .ik{color:#8fd3a5}
details.kesz-lista>summary{list-style:none;cursor:pointer}
details.kesz-lista>summary::-webkit-details-marker{display:none}

/* ---------- Részletoldal ---------- */
.vissza{align-self:flex-start;background:transparent;border:0;color:var(--bg-ink);font-weight:700;font-size:17px;min-height:46px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
.vissza svg{width:22px;height:22px}
.reszletfej{display:flex;flex-direction:column;gap:8px}
.reszletfej h2{font-size:26px}
.kartya{background:var(--paper-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kartya .resz{font-weight:800;color:var(--accent);font-size:15px}
.kartya .feladat{white-space:pre-wrap;font-size:19px;line-height:1.6}
.kartya.ok{background:var(--ok-soft)}
.valasz{display:flex;flex-direction:column;gap:8px}
.allapot{font-size:16px;min-height:1.2em;font-weight:600}
.allapot.rossz{color:var(--stamp)}
.rezeg{animation:rezeg .35s}
@keyframes rezeg{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.helyes{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ok);font-size:18px}
.helyes svg{width:24px;height:24px;flex:0 0 24px}
.sugodoboz{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sugo{background:#fff;border-left:4px solid var(--accent);padding:12px 14px;border-radius:8px;font-size:17px}
.lakat{font-family:var(--f-type);font-weight:700;font-size:48px;letter-spacing:.2em;text-align:center;color:var(--accent);line-height:1.1}
.lepesek{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:10px;font-size:18px}
.pontjel{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:#3d2a0b;font-weight:700;font-size:16px}

/* ---------- Akta ---------- */
.szegmens{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg-2);border:1px solid var(--bg-line);border-radius:14px;padding:4px}
.szegmens button{border:0;background:transparent;color:var(--bg-muted);min-height:46px;border-radius:10px;font-weight:700;font-size:15px}
.szegmens button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.szurok{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.szurok button{flex:0 0 auto;border:1px solid var(--bg-line);background:transparent;color:var(--bg-ink);min-height:40px;padding:0 14px;border-radius:20px;font-size:15px;font-weight:600}
.szurok button[aria-pressed="true"]{background:var(--bg-ink);color:var(--bg);border-color:var(--bg-ink)}
.iratsor{width:100%;display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border:0;border-radius:14px;padding:12px 14px;min-height:68px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.iratsor .ik{flex:0 0 40px;height:40px;border-radius:10px;background:var(--paper-2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.iratsor .ik svg{width:22px;height:22px}
.iratsor .t{flex:1;min-width:0}
.iratsor strong{display:block;font-size:17px;line-height:1.25}
.iratsor small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.ujcimke{display:inline-block;background:var(--stamp);color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px}
.gyanusitott{display:flex;flex-direction:column;gap:4px}
.gyanusitott b{font-size:20px}
.monogram{flex:0 0 48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px}

/* ---------- Ablak ---------- */
.ablak-hatter{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.ablak{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.ablak h2{font-size:23px}
.ablak ol{margin:0;padding-left:22px;display:grid;gap:10px}
@media (min-width:640px){.ablak-hatter{align-items:center}}
.figyelmeztet{position:fixed;left:12px;right:12px;top:calc(78px + env(safe-area-inset-top));z-index:60;max-width:600px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:600}

/* ---------- Nyitó képernyők ---------- */
.nyito{padding:24px 2px 4px;display:flex;flex-direction:column;gap:10px}
.nyito h1{font-size:clamp(38px,11vw,56px);line-height:1.05}
.nyito p{color:var(--bg-muted);font-size:18px}
.pecsetjel{display:inline-block;font-family:var(--f-type);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--stamp);border:2px solid var(--stamp);padding:3px 8px;transform:rotate(-2deg);align-self:flex-start;background:var(--paper)}
.ugykartya{width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ugykartya h2{font-family:var(--f-display);font-weight:400;font-size:30px}

/* ---------- Vádirat ---------- */
.kerdes{display:flex;flex-direction:column;gap:8px}
.kerdes>b{font-size:19px}
.opciok{display:flex;flex-direction:column;gap:8px}
.opcio{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#16130e;font-size:18px;text-align:left}
.opcio[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opcio .kor{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--muted)}
.opcio[aria-pressed="true"] .kor{border:7px solid var(--accent)}
.eredmenykod{font-family:var(--f-type);font-weight:700;font-size:42px;letter-spacing:.12em;text-align:center;background:#fff;border:2px dashed var(--accent);border-radius:14px;padding:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ablak" hidden></div>

<script type="module">
const KOZOS = (() => {

// Közös segédfüggvények — a böngésző (csapat-app, játékmesteri konzol) és a build script (Node) is ezt használja.
// Semmi DOM-függés nincs benne, így Node 18+ alatt is fut.

const subtle = globalThis.crypto.subtle;
const enc = new TextEncoder();
const dec = new TextDecoder();

const ITER_KARTYA = 60000;   // egy fejtörő-kártya válaszának ellenőrzése
const ITER_TITOK = 120000;   // jutalom / ládatartalom titkosítása a megfejtéssel
const ITER_JM = 200000;      // játékmesteri rész titkosítása jelszóval

/** Válasz egységesítése: ékezet, szóköz, írásjel nélkül, nagybetűvel. "22:05" → "2205", "Rózsakert" → "ROZSAKERT". */
function norm(x) {
  return String(x ?? "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toUpperCase().replace(/[^A-Z0-9]/g, "");
}

const b64 = {
  to(buf) {
    const bytes = new Uint8Array(buf); let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  },
  from(str) {
    const s = atob(str); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
};

function veletlenSo(n = 16) {
  const a = new Uint8Array(n); globalThis.crypto.getRandomValues(a); return b64.to(a);
}

async function pbkdf2Bits(jelszo, so, iter) {
  const kulcs = await subtle.importKey("raw", enc.encode(jelszo), "PBKDF2", false, ["deriveBits"]);
  return subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(so), iterations: iter, hash: "SHA-256" }, kulcs, 256);
}
async function aesKulcs(jelszo, so, iter) {
  const bits = await pbkdf2Bits(jelszo, so, iter);
  return subtle.importKey("raw", bits, "AES-GCM", false, ["encrypt", "decrypt"]);
}

/** Kártyaválasz lenyomata. */
async function lenyomat(valasz, so) {
  return b64.to(await pbkdf2Bits(norm(valasz), so, ITER_KARTYA));
}
async function egyezik(valasz, so, hash) {
  if (!norm(valasz)) return false;
  return (await lenyomat(valasz, so)) === hash;
}

/** Tetszőleges JSON titkosítása jelszóval (AES-GCM). */
async function titkosit(adat, jelszo, so, iter) {
  const iv = new Uint8Array(12); globalThis.crypto.getRandomValues(iv);
  const k = await aesKulcs(jelszo, so, iter);
  const ct = await subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(adat)));
  return { iv: b64.to(iv), ct: b64.to(ct) };
}
/** Visszafejtés. Rossz jelszónál null-t ad (nem dob). */
async function visszafejt(csomag, jelszo, so, iter) {
  try {
    const k = await aesKulcs(jelszo, so, iter);
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: b64.from(csomag.iv) }, k, b64.from(csomag.ct));
    return JSON.parse(dec.decode(pt));
  } catch (e) { return null; }
}

/** A fejtörő teljes kulcsa: a kártyák válaszai sorrendben. */
const fejtoroKulcs = valaszok => valaszok.map(norm).join("|");

/* ---------- Eredménykód: a csapat telefonja ezt mutatja a végén, a játékmester beírja ---------- */
const ABC = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"; // 32 jel, könnyen olvasható (nincs 0/O, 1/I)
function ellenorzo(n, sz) { let h = 7; for (const c of String(n) + sz) h = (h * 31 + c.charCodeAt(0)) % 1024; return h; }
/** pont: 0–1023, valasztasok: 4 db 0–7 közötti index (tettes, indíték, fegyver, időpont), sorszam: a csapat 1–31 */
function eredmenyKod(pont, valasztasok, so = "") {
  const p = Math.max(0, Math.min(1023, Math.round(pont)));
  const v = valasztasok.map(x => Math.max(0, Math.min(7, x | 0)));
  let n = p; for (const x of v) n = n * 8 + x;            // 10 + 12 bit
  const c = ellenorzo(n, so);                               // 10 bit
  let big = n * 1024 + c, s = "";
  for (let i = 0; i < 7; i++) { s = ABC[big % 32] + s; big = Math.floor(big / 32); }
  return s.slice(0, 3) + "-" + s.slice(3);
}
function eredmenyKodOlvas(kod, so = "") {
  const s = String(kod || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (s.length !== 7) return null;
  let big = 0;
  for (const ch of s) { const i = ABC.indexOf(ch); if (i < 0) return null; big = big * 32 + i; }
  const c = big % 1024, n = Math.floor(big / 1024);
  if (ellenorzo(n, so) !== c) return null;
  let m = n; const v = [];
  for (let i = 0; i < 4; i++) { v.unshift(m % 8); m = Math.floor(m / 8); }
  return { pont: m, valasztasok: v };
}

/* ---------- Idő ---------- */
const ido = m => { m = Math.max(0, Math.floor(m)); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };
/** "1905" vagy "19:05" → a mai (vagy tegnapi, ha éjfél utáni) 19:05 időbélyege */
function inditokodbol(kod, most = Date.now()) {
  const d = String(kod || "").replace(/\D/g, "");
  if (d.length !== 4) return null;
  const h = +d.slice(0, 2), mi = +d.slice(2);
  if (h > 23 || mi > 59) return null;
  const t = new Date(most); t.setHours(h, mi, 0, 0);
  let ts = t.getTime();
  if (ts - most > 60 * 60000) ts -= 24 * 3600000;   // éjfél után indított játék
  return ts;
}
function inditokod(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0"); }

/* ---------- Pontozás (a csapat telefonja számolja a fejtörő- és ládapontokat) ---------- */
function fejtoroPont(pontozas, nehezseg, sugoSzam) {
  const alap = (pontozas.fejtoro || {})[nehezseg] ?? 8;
  return Math.max(Math.ceil(alap / 2), alap - sugoSzam * (pontozas.sugo ?? 2));
}
function ladaPont(pontozas, percAKapuUtan, sugoSzam = 0) {
  const sav = pontozas.lada || [10, 8, 6, 4];      // 0–10 perc, 10–20, 20–30, utána
  const i = Math.min(sav.length - 1, Math.floor(Math.max(0, percAKapuUtan) / 10));
  return Math.max(2, sav[i] - sugoSzam * (pontozas.sugo ?? 2));
}

return { ITER_KARTYA, ITER_TITOK, ITER_JM, norm, b64, veletlenSo, lenyomat, egyezik, titkosit, visszafejt, fejtoroKulcs, eredmenyKod, eredmenyKodOlvas, ido, inditokodbol, inditokod, fejtoroPont, ladaPont };
})();
const IRATOK = (() => {

// Iratok (bizonyítékok) megjelenítése HTML-ként — telefonon és nyomtatásban ugyanúgy.
// Irattípusok: jegyzokonyv, vallomas, level, tavirat, naplo, feljegyzes, nyugta, dokumentum, ujsag, fenykep, helyszinrajz
// Mezők: tipus, cim, datum, hely, szoveg, alairas, pecset, egett (true), abra (beépített rajz neve), kep (saját kép útvonala), felirat, rajz (helyszínrajz adatai)

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const INK = "#3b2a17";
const S = `fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
const SF = `stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;

/** Beépített rajzok a „fényképekhez”. Mindegyik 400×300-as vásznon. */
const ABRAK = {
  zsebora: `<path ${S} d="M200 40 v-18 M188 22 h24"/><circle cx="200" cy="58" r="10" ${S}/>
    <circle cx="200" cy="160" r="92" ${S}/><circle cx="200" cy="160" r="80" fill="#f3e6c8" ${SF} stroke-width="2"/>
    ${Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6; return `<line x1="${200 + 68 * Math.sin(a)}" y1="${160 - 68 * Math.cos(a)}" x2="${200 + 76 * Math.sin(a)}" y2="${160 - 76 * Math.cos(a)}" stroke="${INK}" stroke-width="${i % 3 ? 2 : 4}"/>`; }).join("")}
    <line x1="200" y1="160" x2="${200 + 42 * Math.sin(-Math.PI / 6 * 1.75)}" y2="${160 - 42 * Math.cos(-Math.PI / 6 * 1.75)}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="160" x2="262" y2="160" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="160" r="5" fill="${INK}"/>
    <path ${S} stroke-width="2" d="M292 120 q40 -30 70 10 q20 30 -10 60"/><path ${S} stroke-width="2" d="M300 135 q30 -20 50 8"/>`,
  setapalca: `<path ${S} stroke-width="9" d="M95 270 L300 70"/><path ${S} stroke-width="4" d="M95 270 L300 70" stroke="#f3e6c8"/>
    <ellipse cx="312" cy="58" rx="26" ry="20" transform="rotate(-45 312 58)" fill="#d8d1c0" ${SF}/>
    <path ${S} stroke-width="2" d="M298 52 q10 -8 22 0 M304 64 q10 -8 22 0"/><path ${S} d="M285 85 l18 -18"/>
    <circle cx="322" cy="44" r="3" fill="${INK}"/><circle cx="330" cy="58" r="2" fill="${INK}"/><path ${S} stroke-width="1.5" d="M335 40 q14 -6 24 4"/>`,
  zsebkendo: `<path ${S} d="M90 70 L310 60 L320 240 L100 250 Z"/><path ${S} stroke-width="1.5" stroke-dasharray="4 6" d="M105 82 L298 74 L306 226 L114 236 Z"/>
    <path fill="#7a2a1e" opacity=".75" d="M190 140 q30 -18 46 6 q14 26 -18 34 q-34 8 -38 -14 q-2 -16 10 -26z"/><circle cx="250" cy="175" r="6" fill="#7a2a1e" opacity=".6"/>
    <text x="270" y="225" font-family="Georgia,serif" font-style="italic" font-size="22" fill="${INK}">K. I.</text>`,
  lampas: `<path ${S} d="M60 250 h280"/><path ${S} d="M250 250 V90 M236 90 h28 M250 90 l40 -40"/><circle cx="292" cy="48" r="8" ${S}/>
    <g transform="rotate(-70 140 225)"><rect x="110" y="150" width="60" height="80" rx="6" ${S}/><path ${S} d="M110 150 l30 -26 l30 26 M140 124 v-14"/><path ${S} stroke-width="1.5" d="M120 165 h40 M120 215 h40"/></g>
    <path fill="${INK}" opacity=".15" d="M70 250 q60 -20 120 0z"/>`,
  sziluett: `<ellipse cx="200" cy="150" rx="120" ry="130" ${S}/><ellipse cx="200" cy="150" rx="108" ry="118" fill="#e9dcbc" ${SF} stroke-width="1.5"/>
    <path fill="#5a4630" d="M200 80 q-38 0 -40 44 q0 30 18 46 q-56 14 -68 70 q60 30 180 0 q-12 -56 -68 -70 q18 -16 18 -46 q-2 -44 -40 -44z"/>`,
  gyongysor: `${Array.from({ length: 23 }, (_, i) => { const a = Math.PI * (0.1 + 0.8 * i / 22); return `<circle cx="${200 - 150 * Math.cos(a)}" cy="${60 + 150 * Math.sin(a)}" r="10" fill="#f8f2e4" ${SF} stroke-width="2"/>`; }).join("")}
    ${Array.from({ length: 19 }, (_, i) => { const a = Math.PI * (0.15 + 0.7 * i / 18); return `<circle cx="${200 - 115 * Math.cos(a)}" cy="${60 + 115 * Math.sin(a)}" r="8" fill="#f8f2e4" ${SF} stroke-width="2"/>`; }).join("")}`,
  fokonyv: `<path ${S} d="M50 80 L200 95 L350 80 L350 240 L200 255 L50 240 Z M200 95 V255"/>
    ${Array.from({ length: 7 }, (_, i) => `<path ${S} stroke-width="1.2" d="M68 ${115 + i * 18} L185 ${125 + i * 18}"/>`).join("")}
    <path ${S} stroke-width="2.5" d="M215 120 l18 10 l-10 14 l20 8 l-8 16 l22 6 l-12 18 l20 10 l-14 16 l16 12 l-10 14"/>
    <text x="72" y="110" font-family="Courier New,monospace" font-size="13" fill="${INK}">A. S. ...... 200 P</text>`,
  kulcs: `<circle cx="120" cy="150" r="42" ${S}/><circle cx="120" cy="150" r="16" ${S}/><path ${S} d="M162 150 H330 M300 150 v26 M280 150 v18 M320 150 v20"/>`,
  boritek: `<rect x="70" y="80" width="260" height="160" ${S}/><path ${S} d="M70 80 L200 170 L330 80"/><circle cx="200" cy="170" r="16" fill="#7a2a1e" opacity=".8"/>
    <path ${S} stroke-width="1.5" d="M110 205 h90 M110 220 h60"/>`,
  uveg: `<path ${S} d="M180 50 h40 v40 q30 20 30 60 v100 q0 10 -10 10 h-80 q-10 0 -10 -10 v-100 q0 -40 30 -60 z"/><rect x="165" y="150" width="70" height="50" ${S} stroke-width="2"/>
    <path ${S} stroke-width="1.5" d="M175 168 h50 M175 182 h36"/>`,
  labnyom: `${[[90, 220, -20], [150, 170, -15], [210, 130, -18], [270, 85, -14]].map(([x, y, r], i) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${i % 2 ? -1 : 1} 1)"><ellipse cx="0" cy="0" rx="14" ry="30" fill="${INK}" opacity=".55"/><ellipse cx="0" cy="40" rx="11" ry="12" fill="${INK}" opacity=".55"/></g>`).join("")}
    <path ${S} stroke-width="1.5" d="M300 230 h60 M300 222 v16 M360 222 v16"/><text x="308" y="258" font-family="Courier New,monospace" font-size="14" fill="${INK}">30 cm</text>`,
  malomkerek: `<circle cx="200" cy="150" r="110" ${S}/><circle cx="200" cy="150" r="22" ${S}/>
    ${Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6; return `<line x1="${200 + 22 * Math.cos(a)}" y1="${150 + 22 * Math.sin(a)}" x2="${200 + 110 * Math.cos(a)}" y2="${150 + 110 * Math.sin(a)}" stroke="${INK}" stroke-width="3"/><rect x="${200 + 100 * Math.cos(a) - 10}" y="${150 + 100 * Math.sin(a) - 10}" width="20" height="20" transform="rotate(${i * 30} ${200 + 100 * Math.cos(a)} ${150 + 100 * Math.sin(a)})" ${S} stroke-width="2"/>`; }).join("")}
    <path ${S} stroke-width="2" d="M40 270 q40 -12 80 0 t80 0 t80 0 t80 0"/>`,
  kes: `<path ${S} d="M90 200 L270 110 q30 -10 40 0 q-10 30 -40 30 L120 220 Z"/><path ${S} d="M90 200 l-40 30 q-10 10 0 18 q8 6 18 -2 l52 -26"/>`,
  pohar: `<path ${S} d="M150 60 h100 l-14 110 q-6 30 -36 30 q-30 0 -36 -30 z M200 200 v50 M160 250 h80"/><path fill="#7a2a1e" opacity=".5" d="M158 110 h84 l-6 56 q-6 22 -36 22 q-30 0 -36 -22z"/>`
};
const ABRA_NEVEK = Object.keys(ABRAK);

function abraSvg(nev, cim) {
  const tartalom = ABRAK[nev] || `<rect x="80" y="70" width="240" height="160" ${S}/><text x="200" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="${INK}">${esc(cim || "tárgy")}</text>`;
  return `<svg viewBox="0 0 400 300" role="img" aria-label="${esc(cim || nev)}"><defs><filter id="szemcse"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .16  0 0 0 0 .09  0 0 0 .18 0"/></filter>
    <radialGradient id="vignetta" cx="50%" cy="50%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#2a1c0c" stop-opacity=".45"/></radialGradient></defs>
    <rect width="400" height="300" fill="#e8d9b5"/>${tartalom}<rect width="400" height="300" filter="url(#szemcse)"/><rect width="400" height="300" fill="url(#vignetta)"/></svg>`;
}

/** Helyszínrajz rajzolása 0–100-as koordinátákból.
 * rajz: { szobak:[{nev,x,y,w,h}], ajtok:[{x,y,irany:"v"|"f"}], jelek:[{x,y,jel,cimke}], vonalak:[{pontok:[[x,y],…],szaggatott,cimke}] } */
function rajzSvg(r) {
  const X = v => 20 + v * 5.6, Y = v => 20 + v * 3.6;
  const szobak = (r.szobak || []).map(s => `<rect x="${X(s.x)}" y="${Y(s.y)}" width="${s.w * 5.6}" height="${s.h * 3.6}" fill="none" stroke="${INK}" stroke-width="3"/>
    <text x="${X(s.x + s.w / 2)}" y="${Y(s.y) + 18}" text-anchor="middle" font-family="Courier New,monospace" font-size="13" fill="${INK}">${esc(s.nev)}</text>`).join("");
  const ajtok = (r.ajtok || []).map(a => a.irany === "v"
    ? `<line x1="${X(a.x)}" y1="${Y(a.y) - 12}" x2="${X(a.x)}" y2="${Y(a.y) + 12}" stroke="#e8d9b5" stroke-width="7"/><path d="M${X(a.x)} ${Y(a.y) - 12} q14 12 0 24" fill="none" stroke="${INK}" stroke-width="1.5"/>`
    : `<line x1="${X(a.x) - 12}" y1="${Y(a.y)}" x2="${X(a.x) + 12}" y2="${Y(a.y)}" stroke="#e8d9b5" stroke-width="7"/><path d="M${X(a.x) - 12} ${Y(a.y)} q12 14 24 0" fill="none" stroke="${INK}" stroke-width="1.5"/>`).join("");
  const vonalak = (r.vonalak || []).map(v => `<polyline points="${v.pontok.map(([x, y]) => X(x) + "," + Y(y)).join(" ")}" fill="none" stroke="#7a2a1e" stroke-width="2.5" ${v.szaggatott ? 'stroke-dasharray="7 6"' : ""}/>`).join("");
  let n = 0;
  const jelmagy = [];
  const jelek = (r.jelek || []).map(j => {
    const sz = j.jel || String(++n);
    if (j.cimke) jelmagy.push(`<li><b>${esc(sz)}</b> — ${esc(j.cimke)}</li>`);
    return `<circle cx="${X(j.x)}" cy="${Y(j.y)}" r="11" fill="#f3e6c8" stroke="#7a2a1e" stroke-width="2"/><text x="${X(j.x)}" y="${Y(j.y) + 5}" text-anchor="middle" font-family="Courier New,monospace" font-weight="700" font-size="13" fill="#7a2a1e">${esc(sz)}</text>`;
  }).join("");
  (r.vonalak || []).forEach(v => { if (v.cimke) jelmagy.push(`<li><b>- - -</b> ${esc(v.cimke)}</li>`); });
  return `<div class="rajz"><svg viewBox="0 0 600 400" role="img" aria-label="Helyszínrajz"><rect width="600" height="400" fill="#e8d9b5"/>
    <g stroke="${INK}" stroke-opacity=".08">${Array.from({ length: 20 }, (_, i) => `<line x1="${i * 30}" y1="0" x2="${i * 30}" y2="400"/>`).join("")}${Array.from({ length: 14 }, (_, i) => `<line x1="0" y1="${i * 30}" x2="600" y2="${i * 30}"/>`).join("")}</g>
    ${szobak}${ajtok}${vonalak}${jelek}<text x="580" y="388" text-anchor="end" font-family="Courier New,monospace" font-size="12" fill="${INK}">É ↑</text></svg>
    ${jelmagy.length ? `<ul class="jelmagy">${jelmagy.join("")}</ul>` : ""}</div>`;
}

const szoveg = t => `<div class="i-szoveg">${esc(t)}</div>`;
const fej = (felirat, d) => `<div class="i-fej"><span>${esc(felirat)}</span>${d.datum ? `<span>${esc(d.datum)}</span>` : ""}</div>`;
const pecset = d => d.pecset ? `<div class="i-pecset" aria-hidden="true"><span>${esc(d.pecset)}</span></div>` : "";

const CSOMAG = (() => {
const K = KOZOS; const { ABRA_NEVEK } = IRATOK;

const TEMAK = ["noir1920", "vadasz", "modern", "borzongos"];

/* ---------------- Ellenőrzés ---------------- */

/* ---------------- Átalakítás publikus (titkosított) formára ---------------- */
async function csomagol(u, JELSZO) {

// Az elérhető ügyek listája.

// Máshol (helyi próba, bemutató) az ugyek/lista.json fájlt használja.

function githubRepo() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const elso = location.pathname.split("/").filter(Boolean)[0];
  const repo = elso && !elso.includes(".") ? elso : owner + ".github.io";
  return { owner, repo };
}

const gyorstar = new Map();
/** Egy ügyfájl betöltése (a lista már betöltötte, ha lehet) */
async function ugyFajl(sor) {
  const fajl = sor.fajl || sor.id + ".json";
  if (gyorstar.has(fajl)) return gyorstar.get(fajl);
  const r = await fetch(fajl.split("/").map(encodeURIComponent).join("/"), { cache: "no-cache" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const u = await r.json(); gyorstar.set(fajl, u); return u;
}

      const helyek = ["", "ugyek"];
      const listak = await Promise.all(helyek.map(async h => {
        const r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${h}`, { headers: { Accept: "application/vnd.github+json" } });
        return r.ok ? await r.json() : null;

      // egy korábbi, már lejárt játék maradéka ezen a telefonon? → tiszta lap
      if (A.start && Date.now() - A.start > U.idotartam * 60000) { A = { ...ures(), csapat: A.csapat }; ment(); }
      if (!A.start) { qrKod = qKod; rajzol(); }
    }
    try { history.replaceState(null, "", location.pathname + "?ugy=" + encodeURIComponent(qUgy)); } catch (e) {}
    setInterval(ketyeg, 1000); return;
  }
  const aktiv = tarolo.get("nyi:aktiv", null);
  if (aktiv && LISTA.some(x => x.id === aktiv)) await ugyBetolt(aktiv);
  else rajzol();
  setInterval(ketyeg, 1000);
}
async function ugyBetolt(id) {
  try {
    U = await ugyFajl(LISTA.find(x => x.id === id) || { id });
  } catch (e) { U = null; uzen("Az ügyet nem sikerült betölteni. Ellenőrizzétek az internetet, és próbáljátok újra.", "hiba"); rajzol(); return; }
  temaBeallit(U.tema);
  A = { ...ures(), ...tarolo.get(kulcs(), {}) };
  tarolo.set("nyi:aktiv", id);
  nezet = "feladatok"; reszlet = null;
  rajzol();
}

/* ---------------- Számítások ---------------- */
function pontok() {
  let p = 0;
  for (const f of U.fejtorok) if (A.megoldott[f.id]) p += fejtoroPont(U.pontozas, f.nehezseg, A.sugo[f.id] || 0);
  for (const l of U.ladak) { const s = A.ladak[l.id]; if (s?.ido != null) p += ladaPont(U.pontozas, s.ido - l.nyilik, A.sugo[l.id] || 0); }
  return p;
}
/** Minden irat, amit a csapat lát: dosszié + megszerzett */
function iratok() {
  const l = U.dosszie.map(d => ({ d, honnan: "Dosszié", mikor: -1, dossz: true }));
  for (const f of U.fejtorok) if (A.megoldott[f.id]) for (const d of A.megoldott[f.id].jutalom || []) l.push({ d, honnan: f.cim, mikor: A.megoldott[f.id].ido });
  for (const b of U.ladak) { const s = A.ladak[b.id]; if (s?.ido != null) for (const d of s.iratok || []) l.push({ d, honnan: b.nev, mikor: s.ido }); }
  return l;
}
const ujIratok = () => iratok().filter(x => !x.dossz && !A.latott[x.d.id]);

/* ---------------- Rajzolás ---------------- */
const $ = s => document.querySelector(s);
function rajzol() {
  const app = $("#app");
  if (!U) { app.innerHTML = valaszto(); return; }
  if (!A.start) { app.innerHTML = belepes(); return; }
  let tartalom;
  if (reszlet?.tipus === "fejtoro") tartalom = fejtoroOldal(reszlet.id);
  else if (reszlet?.tipus === "lada") tartalom = ladaOldal(reszlet.id);
  else if (reszlet?.tipus === "irat") tartalom = iratOldal(reszlet.id);
  else tartalom = { feladatok: feladatokOldal, akta: aktaOldal, naplo: naploOldal, vadirat: vadOldal }[nezet]();
  const uj = ujIratok().length;
  app.innerHTML = `
  <header class="fejlec">
    <span style="flex:0 0 auto;display:flex">${logoJel(36)}</span>
    <div class="cim"><b>${esc(A.csapat)}</b><small>${esc(U.cim)} · ${pontok()} pont</small></div>
    <div class="ora ${U.idotartam - perc() <= 0 ? "vege" : ""}" data-ora>${oraSzoveg()}</div>
    <button class="menugomb" data-act="menu" aria-label="Menü">${IK.menu}</button>
  </header>
  <main class="oldal">${tartalom}</main>
  <nav class="alsomenu" aria-label="Fő menü">
    ${[["feladatok", "Feladatok", IK.feladat], ["akta", "Akta", IK.akta], ["naplo", "Napló", IK.naplo], ["vadirat", "Vádirat", IK.vad]].map(([k, l, i]) =>
      `<button data-nav="${k}" ${nezet === k ? 'aria-current="page"' : ""}>${i}${l}${k === "akta" && uj ? `<span class="jelzo">${uj}</span>` : ""}</button>`).join("")}
  </nav>`;
  if (!A.szabaly) { A.szabaly = true; ment(); szabalyok(); }
}
function oraSzoveg() {
  const hatra = U.idotartam - perc();
  return hatra > 0 ? `<b>${vissza(U.idotartam)}</b><small>hátravan</small>` : `<b>0:00</b><small>lejárt</small>`;

/* --- Feladatok --- */
function kovetkezoTeendo() {
  if (!A.olvasott && !Object.keys(A.megoldott).length) return { felirat: "Első lépés", cim: "Ismerjétek meg az ügyet", szoveg: "Olvassátok el együtt, mi történt, és ki a hét gyanúsított. Utána jöhetnek a fejtörők.", act: `data-akta-ugy="1"`, gomb: "Az ügy elolvasása" };
  const nyithato = U.ladak.find(l => nyitva(l.nyilik) && A.ladak[l.id]?.ido == null);
  if (nyithato) return { felirat: "Most nyitható", cim: nyithato.nev, szoveg: "Fejtsétek meg a láda kódját. Minél hamarabb sikerül, annál több pont jár.", act: `data-lada="${nyithato.id}"`, gomb: "A láda feladványa" };
  const atvetel = U.ladak.find(l => A.ladak[l.id]?.ido != null && !A.ladak[l.id]?.atveve);
  if (atvetel) return { felirat: "Teendő", cim: `Vegyétek ki a borítékot: ${atvetel.nev}`, szoveg: "A kód megvan. Menjetek a ládához, vegyétek ki a saját borítékotokat, és zárjátok vissza.", act: `data-lada="${atvetel.id}"`, gomb: "Mit kell tenni?" };
  const nyitott = U.fejtorok.filter(f => nyitva(f.nyilik) && !A.megoldott[f.id]);
  if (nyitott.length) return { felirat: "Most ez a dolgotok", cim: `${nyitott.length} fejtörő vár rátok`, szoveg: "Bármelyikkel kezdhettek. Osszátok szét őket a csapatban, úgy gyorsabb.", act: `data-fejtoro="${nyitott[0].id}"`, gomb: nyitott[0].cim };
  if (!A.vad.leadva && nyitva(U.vadirat.nyilik)) return { felirat: "Most ez a dolgotok", cim: "Ideje a vádiratnak", szoveg: "Nézzétek át az iratokat, és adjátok le a vádiratot. Csak egyszer lehet.", act: `data-nav="vadirat"`, gomb: "Vádirat" };
  if (A.vad.leadva) return { felirat: "Kész", cim: "A vádirat leadva", szoveg: "Mutassátok meg az eredménykódot a játékmesternek.", act: `data-nav="vadirat"`, gomb: "Eredménykód" };
  return { felirat: "Szusszanjatok", cim: "Minden nyitott feladat kész", szoveg: "Közben olvassátok át az iratokat, és írjátok a naplót. Lent látjátok, mi nyílik legközelebb.", act: `data-nav="akta"`, gomb: "Az iratok" };
}
function feladatokOldal() {
  const t = kovetkezoTeendo();
  const fKesz = U.fejtorok.filter(f => A.megoldott[f.id]).length, lKesz = U.ladak.filter(l => A.ladak[l.id]?.ido != null).length;
  const ossz = U.fejtorok.length + U.ladak.length, kesz = fKesz + lKesz;
  const nyitLada = U.ladak.filter(l => nyitva(l.nyilik) && A.ladak[l.id]?.ido == null);
  const nyitF = U.fejtorok.filter(f => nyitva(f.nyilik) && !A.megoldott[f.id]);
  // hamarosan: ládák egyenként, fejtörők felvonásonként összevonva
  const hamar = [];
  U.ladak.filter(l => !nyitva(l.nyilik)).forEach(l => hamar.push({ m: l.nyilik, ik: IK.lakat, cim: l.nev, al: "Láda — időzár" }));
  const fv = {}; U.fejtorok.filter(f => !nyitva(f.nyilik)).forEach(f => { (fv[f.nyilik] = fv[f.nyilik] || []).push(f); });
  Object.entries(fv).forEach(([m, l]) => hamar.push({ m: +m, ik: IK.lakat, cim: `${l[0].felvonas}. felvonás: ${l.length} új fejtörő`, al: l.map(f => f.cim).join(", ") }));
  if (!A.vad.leadva && !nyitva(U.vadirat.nyilik)) hamar.push({ m: U.vadirat.nyilik, ik: IK.vad, cim: "Vádirat", al: "Ekkortól adható le" });
  hamar.sort((a, b) => a.m - b.m);
  const keszek = [
    ...U.ladak.filter(l => A.ladak[l.id]?.ido != null).map(l => ({ act: `data-lada="${l.id}"`, cim: l.nev, al: `Láda · ${Math.floor(A.ladak[l.id].ido)}. perc`, p: ladaPont(U.pontozas, A.ladak[l.id].ido - l.nyilik, A.sugo[l.id] || 0) })),
    ...U.fejtorok.filter(f => A.megoldott[f.id]).map(f => ({ act: `data-fejtoro="${f.id}"`, cim: f.cim, al: `Fejtörő · ${Math.floor(A.megoldott[f.id].ido)}. perc`, p: fejtoroPont(U.pontozas, f.nehezseg, A.sugo[f.id] || 0) }))];
  return `
  <section class="fokartya"><span class="felirat">${t.felirat}</span><h2>${esc(t.cim)}</h2><p>${t.szoveg}</p><button class="gomb teljes" ${t.act}>${esc(t.gomb)} ${IK.nyil}</button></section>
  <div class="halado"><div class="sor"><span>Haladás: <b>${kesz}/${ossz}</b> feladat</span><span><b>${pontok()}</b> pont</span></div><div class="savok"><i style="width:${ossz ? Math.round(kesz / ossz * 100) : 0}%"></i></div></div>
  ${nyitLada.length || nyitF.length ? `<div class="szakasz"><span>Nyitott feladatok</span><span>${nyitLada.length + nyitF.length}</span></div>
    ${nyitLada.map(l => `<button class="tetel lada" data-lada="${l.id}"><span class="jel">${IK.lada}</span><span class="szoveg"><strong>${esc(l.nev)}</strong><small>Láda · most ${ladaPont(U.pontozas, perc() - l.nyilik, A.sugo[l.id] || 0)} pont jár érte</small></span><span class="nyil">${IK.nyil}</span></button>`).join("")}
    ${nyitF.map(f => `<button class="tetel" data-fejtoro="${f.id}"><span class="jel">${esc(f.id)}</span><span class="szoveg"><strong>${esc(f.cim)}</strong><small>${esc(f.mechanika)} · ${NEHEZ[f.nehezseg]} · ${fejtoroPont(U.pontozas, f.nehezseg, A.sugo[f.id] || 0)} pont${A.kartya[f.id]?.some(Boolean) ? " · elkezdve" : ""}</small></span><span class="nyil">${IK.nyil}</span></button>`).join("")}` : ""}
  ${hamar.length ? `<div class="szakasz"><span>Hamarosan</span></div><div class="sorlista">${hamar.map(h => `<div class="s"><span class="ik">${h.ik}</span><span class="t">${esc(h.cim)}<small>${esc(h.al)}</small></span><span class="v" data-vissza="${h.m}">${vissza(h.m)}</span></div>`).join("")}</div>` : ""}
  ${keszek.length ? `<details class="kesz-lista"><summary class="szakasz"><span>Megoldva · ${keszek.length}</span><span>megnézem ›</span></summary><div class="sorlista" style="margin-top:10px">${keszek.map(k => `<button class="s kesz" ${k.act}><span class="ik">${IK.pipa}</span><span class="t">${esc(k.cim)}<small>${esc(k.al)}</small></span><span class="v">+${k.p}</span></button>`).join("")}</div></details>` : ""}`;
}

}

    ${m ? `<p class="ertesites ok"><b>Megfejtve, +${fejtoroPont(U.pontozas, f.nehezseg, A.sugo[id] || 0)} pont.</b> Az új irat bekerült az aktába.</p>
      <p class="halv"><b>A megoldás menete:</b> ${esc(m.magyarazat)}</p>
      ${(m.jutalom || []).map(d => irat(d)).join("")}` : sugoBlokk(id, f.sugok)}
  </section>`;

    ${s.atveve ? `<p class="ertesites ok">A borítékot átvettétek. Az iratok lent és az aktában is megvannak.</p>` : `

      <button class="gomb teljes" data-atvesz="${l.id}">Megvan a boríték, visszazártuk</button>`}

/* --- Akta --- */
function aktaOldal() {
  const uj = ujIratok().length;
  const fulek = `<div class="szegmens" role="group" aria-label="Akta">${[["ugy", "Az ügy"], ["gyanusitottak", "Gyanúsítottak"], ["iratok", `Iratok${uj ? ` (${uj} új)` : ""}`]].map(([k, l]) => `<button data-aktaful="${k}" aria-pressed="${aktaFul === k}">${l}</button>`).join("")}</div>`;
  if (aktaFul === "ugy") { if (!A.olvasott) { A.olvasott = true; ment(); } return fulek + `
    <section class="lap"><span class="felirat halv">${esc(U.korszak)}</span><h2>${esc(U.cim)}</h2><p style="white-space:pre-wrap">${esc(U.bevezeto)}</p></section>
    <section class="lap"><h3>A megbízás</h3><p>${esc(U.megbizas)}</p></section>
    <section class="lap"><span class="felirat halv">Az áldozat</span><h3>${esc(U.aldozat.nev)}${U.aldozat.kor ? ", " + U.aldozat.kor : ""}</h3><p>${esc(U.aldozat.leiras)}</p><p class="halv">${esc(U.aldozat.megtalalas)}</p></section>
    <button class="gomb teljes" data-aktaful="gyanusitottak">Tovább a gyanúsítottakhoz ${IK.nyil}</button>`; }
  if (aktaFul === "gyanusitottak") return fulek + U.gyanusitottak.map(g => `
    <section class="lap"><div class="sor" style="flex-wrap:nowrap;align-items:flex-start"><span class="monogram">${esc(g.nev.replace(/^Dr\.\s*/, "").split(" ").map(w => w[0]).join("").slice(0, 2))}</span>
      <div class="gyanusitott"><b>${esc(g.nev)}${g.kor ? ", " + g.kor : ""}</b><span class="halv">${esc(g.kapcsolat)}</span><span>${esc(g.leiras)}</span></div></div></section>`).join("")
    + `<button class="gomb teljes" data-aktaful="iratok">Tovább az iratokhoz ${IK.nyil}</button>`;
  let l = iratok();
  if (iratSzuro === "uj") l = l.filter(x => !x.dossz && !A.latott[x.d.id]);
  if (iratSzuro === "megszerzett") l = l.filter(x => !x.dossz);
  if (iratSzuro === "dosszie") l = l.filter(x => x.dossz);
  if (iratSzuro === "fenykep") l = l.filter(x => x.d.tipus === "fenykep" || x.d.tipus === "helyszinrajz");
  l.sort((a, b) => b.mikor - a.mikor);
  const szurok = [["mind", "Mind"], ["uj", `Új${uj ? ` (${uj})` : ""}`], ["megszerzett", "Megszerzett"], ["dosszie", "Dosszié"], ["fenykep", "Képek, rajzok"]];
  return fulek + `<div class="szurok">${szurok.map(([k, t]) => `<button data-szuro="${k}" aria-pressed="${iratSzuro === k}">${t}</button>`).join("")}</div>
    ${l.length ? l.map(x => `<button class="iratsor" data-irat="${esc(x.d.id)}"><span class="ik">${IRATIKON[x.d.tipus] || IK.irat}</span><span class="t"><strong>${!x.dossz && !A.latott[x.d.id] ? '<span class="ujcimke">ÚJ</span>' : ""}${esc(x.d.cim || IRATNEV[x.d.tipus])}</strong><small>${IRATNEV[x.d.tipus] || "Irat"} · ${esc(x.honnan)}${x.mikor >= 0 ? ` · ${Math.floor(x.mikor)}. perc` : ""}</small></span><span class="nyil" style="color:var(--muted)">${IK.nyil}</span></button>`).join("")

}
function iratOldal(id) {
  const x = iratok().find(y => y.d.id === id);

  const l = iratok().sort((a, b) => b.mikor - a.mikor); const i = l.findIndex(y => y.d.id === id);

    <p style="color:var(--bg-muted);font-size:15px">${IRATNEV[x.d.tipus] || "Irat"} · ${esc(x.honnan)}${x.mikor >= 0 ? ` · ${Math.floor(x.mikor)}. perc` : ""}</p>

}

}
function uzen(szoveg, tipus = "") {

  if (d.opcio) { const [i, j] = d.opcio.split("|").map(Number); A.vad.valasz[i] = j; ment(); rajzol(); return; }
  switch (d.act) {
    case "vissza": return menj(() => { if (reszlet?.tipus === "irat") { reszlet = null; nezet = "akta"; aktaFul = "iratok"; } else reszlet = null; });
    case "masikugy": tarolo.set("nyi:aktiv", null); U = null; A = null; temaBeallit("noir1920"); rajzol(); return;

        { felirat: "Még átnézzük", stilus: "masod" }]);

        { felirat: "Vissza a játékba" },

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "belepoUrlap") {
    const nev = $("#csapatnev").value.trim(), ts = inditokodbol($("#indito").value), hiba = $("#belepoHiba");
    const mutat = m => { hiba.hidden = false; hiba.textContent = m; };
    if (!nev) return mutat("Adjatok nevet a csapatnak.");
    if (!ts) return mutat("Az indítókód négy számjegy, például 1905. Kérdezzétek meg a játékmestert.");
    if (Date.now() - ts > U.idotartam * 60000) return mutat("Ez az indítókód egy már lejárt játékhoz tartozik. Ellenőrizzétek a számokat.");
    A.csapat = nev.slice(0, 30); A.start = ts; ment(); rajzol(); return;
  }
  if (f.dataset.kartya) {
    const [id, i] = f.dataset.kartya.split("|"), idx = +i, fj = U.fejtorok.find(x => x.id === id);
    const ertek = f.v.value, msg = f.querySelector(".allapot"), gomb = f.querySelector("button");
    if (!norm(ertek)) { msg.className = "allapot rossz"; msg.textContent = "Írjátok be a megfejtést."; return; }
    gomb.disabled = true; msg.className = "allapot"; msg.textContent = "Ellenőrzés…";
    const jo = await egyezik(ertek, fj.so + ":" + idx, fj.kartyak[idx].hash);
    gomb.disabled = false;
    if (!jo) { msg.className = "allapot rossz"; msg.textContent = "Ez még nem jó. Nézzétek át újra a feltételeket!"; f.classList.remove("rezeg"); void f.offsetWidth; f.classList.add("rezeg"); return; }
    A.kartya[id] = A.kartya[id] || []; A.kartya[id][idx] = ertek.trim().toUpperCase();
    if (fj.kartyak.every((_, j) => A.kartya[id][j])) {
      const titok = await visszafejt(fj.titok, fejtoroKulcs(A.kartya[id]), fj.so, ITER_TITOK);
      if (titok) { A.megoldott[id] = { ido: perc(), jutalom: titok.jutalom, magyarazat: titok.magyarazat }; ment(); rajzol(); uzen("Megfejtve! Új irat került az aktába.", "ok"); return; }
      uzen("A válaszok helyesek, de az iratot nem sikerült megnyitni. Szóljatok a játékmesternek.", "hiba");
    }
    ment(); rajzol(); return;
  }
  if (f.dataset.ladakod) {
    const id = f.dataset.ladakod, l = U.ladak.find(x => x.id === id);
    const ertek = f.v.value.replace(/\D/g, ""), msg = f.querySelector(".allapot"), gomb = f.querySelector("button");
    if (ertek.length !== l.szamjegy) { msg.className = "allapot rossz"; msg.textContent = `A kód ${l.szamjegy} számjegyből áll.`; return; }
    gomb.disabled = true; msg.className = "allapot"; msg.textContent = "Ellenőrzés…";
    const jo = await egyezik(ertek, l.so + ":lada", l.hash);
    gomb.disabled = false;
    if (!jo) { msg.className = "allapot rossz"; msg.textContent = "Nem ez a kód. Ellenőrizzétek a megfejtést!"; f.classList.remove("rezeg"); void f.offsetWidth; f.classList.add("rezeg"); return; }
    const titok = await visszafejt(l.titok, norm(ertek), l.so, ITER_TITOK);
    A.ladak[id] = { ido: perc(), kod: ertek, iratok: titok?.iratok || [], magyarazat: titok?.magyarazat || "", atveve: false };
    ment(); menj(() => {}); return;
  }
});

let mentesIdozito = null;
document.addEventListener("input", e => {

});

/* ---------------- Óra ---------------- */
let utolsoAllapot = "";
const jelzett = new Set();
function ketyeg() {
  if (!U || !A?.start) return;
  const o = $("[data-ora]"); if (o) { o.innerHTML = oraSzoveg(); o.classList.toggle("vege", U.idotartam - perc() <= 0); }
  document.querySelectorAll("[data-vissza]").forEach(el => { el.textContent = vissza(+el.dataset.vissza); });
  const most = [...U.fejtorok.map(f => nyitva(f.nyilik)), ...U.ladak.map(l => nyitva(l.nyilik)), nyitva(U.vadirat.nyilik)].join("");
  if (utolsoAllapot && most !== utolsoAllapot) {
    const ujLada = U.ladak.find(l => nyitva(l.nyilik) && perc() - l.nyilik < 1);
    if (ujLada && !jelzett.has(ujLada.id)) { jelzett.add(ujLada.id); uzen(`${ujLada.nev} most kinyitható!`, "ok"); }

    rajzol();
  }
  utolsoAllapot = most;
}
