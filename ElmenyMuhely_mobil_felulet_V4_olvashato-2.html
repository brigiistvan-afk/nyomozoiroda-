const KEY='em_pwa_demo_v1';const blank=()=>({team:'A csapat',started:null,pausedAt:null,pausedTotal:0,solved:{},boxCodes:{},received:{},hints:{},notes:'',accusation:'',accused:'',gm:false});let S;try{S={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{S=blank()}let page='home',activePuzzle=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('A böngésző nem engedélyezte a mentést.')}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=x=>String(x||'').normalize('NFKC').toLocaleUpperCase('hu').replace(/\s+/g,'').replace(/[|,;–-]/g,'');const mins=()=>!S.started?0:Math.max(0,Math.floor(((S.pausedAt||Date.now())-S.started-S.pausedTotal)/60000));const remaining=()=>Math.max(0,180-mins());const openNav=v=>{document.getElementById('drawer').classList.toggle('open',v);document.getElementById('shade').classList.toggle('open',v)};document.getElementById('menu').onclick=()=>openNav(true);document.getElementById('close').onclick=()=>openNav(false);document.getElementById('shade').onclick=()=>openNav(false);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;activePuzzle=null;openNav(false);render()});function box(inner){return '<section class="paper">'+inner+'</section>'}function note(s){return '<p class="notice">'+s+'</p>'}function render(){const app=document.getElementById('app');let h='';if(page==='home'){h=`<section class="hero"><div class="eyebrow">1928 · NYOMOZATI AKTA</div><h1>Az utolsó őrlés</h1><p>Az éjszaka, amikor a malom elhallgatott. Kardos Vilmost holtan találják a zsilip mellett. Hét gyanúsított, egy megállt zsebóra — és vallomások, amelyek nem illenek össze.</p><div class="topline"><span>Csapat: <b>${esc(S.team)}</b></span><span class="time" id="clock">${remaining()}:00</span></div></section><div class="progress"><div><b>${Object.keys(S.solved).length}/12</b><small>Fejtörő</small></div><div><b>${Object.keys(S.received).length}/4</b><small>Láda</small></div><div><b>${3+Object.keys(S.solved).length+Object.values(S.received).filter(Boolean).length}</b><small>Nyomcsomag</small></div></div><section class="brief"><h2 style="margin:0 0 10px;font:27px Georgia,serif">Az első nyomok már várnak</h2><p>A zsebóra 22:15-öt mutat. Egy szobalány üres vendégszobáról beszél, a kocsis pedig egy bottal járó alakot látott. Kezdjétek a helyszíni jelentéssel és a három első vallomással.</p><button class="btn" style="width:100%" data-go="story">Nyomozás megkezdése →</button></section><div class="sectionlabel">Válasszatok, merre nyomoztok</div><button class="action-card" data-go="story"><span class="glyph">▤</span><span><strong>Az ügy és a vallomások</strong><small>Történet, tanúvallomások, első nyomok</small></span><span class="chev">›</span></button><button class="action-card" data-go="suspects"><span class="glyph">♙</span><span><strong>A hét gyanúsított</strong><small>Indítékok, alibik, kapcsolatok</small></span><span class="chev">›</span></button><button class="action-card" data-go="puzzles"><span class="glyph">◇</span><span><strong>12 digitális fejtörő</strong><small>Változatos logikai, időrendi és szöveges kihívások</small></span><span class="chev">›</span></button><button class="action-card" data-go="boxes"><span class="glyph">▣</span><span><strong>4 fizikai láda</strong><small>Időzített kódok és csapatborítékok</small></span><span class="chev">›</span></button><button class="action-card" data-go="evidence"><span class="glyph">▥</span><span><strong>Bizonyítéktár</strong><small>Megtalált nyomok és megszerzett dokumentumok</small></span><span class="chev">›</span></button><button class="action-card" data-go="notes"><span class="glyph">✎</span><span><strong>Nyomozati napló</strong><small>Elméletek, időrend és saját megfigyelések</small></span><span class="chev">›</span></button>${!S.started?box('<h2>Próba indítása</h2><p>A 180 perces időzítés ezen a telefonon indul. Ez még csak kezelőfelületi prototípus.</p><button class="btn" id="start">Próbaóra indítása</button>'):note('Helyi demó: a készülékek között még nincs szinkronizáció.')}`}

if(page==='story')h=`<section class="hero"><div class="eyebrow">1928 · A malom titka</div><h1>Az utolsó őrlés</h1><p>Nyomozati dosszié · Kardos Vilmos halála</p></section>`+
box(`<h2>Az éjszaka, amikor megállt a malom</h2><p>Október végén a Kardos-malom udvarán még késő este is vendégek jártak. A házban zene szólt, az irodában elszámolások készültek, a konyhából vacsoraillat szállt. Kardos Vilmos, a malom tulajdonosa aznap több emberrel is összeveszett. Azt beszélték, valakit pénzzel tart sakkban, mást kitagadással fenyegetett.</p><p>Az esti összejövetel után a malomkerék váratlanul megállt. A zsilip közelében egy kiáltást hallottak. Amikor a személyzet rátalált a tulajdonosra, már nem adott életjelet. Mellette nedves föld, szétszóródott liszt és egy összetört tárgy apró nyoma látszott.</p><p>A holttestnél talált zsebóra mutatói <b>22:15</b>-ön álltak. A malom körül dolgozók azonban nem értenek egyet abban, mikor történt a baj. A rendőrség hét személyt tart számon, akiknek okuk lehetett haragudni Kardosra.</p><div class="case"><b>Nyomozói megbízatás</b><p>Derítsétek ki, ki ölte meg Kardos Vilmost, miért, és mely bizonyítékok támasztják alá a vádat. Egy gyanús indíték önmagában nem elég.</p></div>`)+
'<h2 class="sectionhead">Azonnal hozzáférhető vallomások</h2>'+
box(`<div class="doclabel">NY–01 · A molnárlegény első jelentése</div><p>„Nem néztem az órámat, de már elhallgatott a zene egy pillanatra, amikor a kerék akadozni kezdett. Aztán kiáltást hallottam a zsilip felől. Mire odafutottunk, a gazda a földön feküdt.”</p><p class="muted">A tanú nem látta a támadást, és a pontos időpontot sem tudja megadni.</p>`)+
box(`<div class="doclabel">NY–02 · A szobalány meghallgatása</div><p>„Az emeleti folyosón vittem tiszta törülközőt. Az egyik vendégszobába bekopogtam, de senki nem felelt. Nem gondoltam, hogy ennek jelentősége lehet.”</p><p class="muted">A szobalány az első kihallgatáskor nem nevezte meg biztosan az időpontot. A szobák és a vendégek mozgása később ellenőrizhető.</p>`)+
box(`<div class="doclabel">NY–03 · A kocsis észlelése</div><p>„A hátsó úton egy férfialakot láttam. Sötét volt, az arcát nem ismertem fel. Mintha bottal járt volna, de nem esküdnék meg rá.”</p><p class="muted">A kocsis vallomása nem alkalmas személyazonosításra.</p>`)+
'<h2 class="sectionhead">Elsőként lefoglalt tárgyak</h2>'+
box(`<div class="opening"><div class="doclabel">NY–04 · Zsebóra</div><p>Az áldozat kabátzsebében találták. A mutatók 22:15-öt jeleznek. A szerkezet állapota még nem tisztázott.</p></div><div class="opening"><div class="doclabel">NY–05 · Szakadt könyvelési lap</div><p>A dolgozószoba kandallója mellett találták. A lapon több pénzösszeg szerepel, de a név és a dátum egy része hiányzik.</p></div><div class="opening"><div class="doclabel">NY–06 · Sáros lábnyomok</div><p>A zsilip és a hátsó bejárat között több egymásra taposott nyom látszik. Az első szemle nem állapította meg, ki hagyta őket.</p></div>`)+
box(`<h2>Hogyan kezdjetek hozzá?</h2><p>Olvassátok el a gyanúsítottak adatlapját, majd osszátok el egymás között a digitális fejtörőket. A ládákban később további, részletes bizonyítékok várnak. Jegyezzétek fel az ellentmondásokat — nem minden vallomás tévedés, és nem minden titok gyilkosság.</p><button class="btn" data-go="suspects">A hét gyanúsított megismerése</button>`);
if(page==='suspects')h='<h1>Gyanúsítottak</h1>'+PEOPLE.map(([n,d])=>box(`<h2>${esc(n)}</h2><p>${esc(d)}</p><p class="muted mini">A további részletek a megszerzett bizonyítékokból derülnek ki.</p>`)).join('');
if(page==='puzzles'){h='<h1>Digitális fejtörők</h1>'+note('Mind a 12 feladvány elérhető. A feladatok eltérő hosszúságúak. A D02 már új, önálló időrendi fejtörő; a többi rejtvény felülvizsgálata még folyamatban van.')+(!activePuzzle?PUZZLES.map(p=>box(`<div class="puzzle-card"><h2>${esc(p.id)} · ${esc(p.title)}</h2><div class="puzzle-meta"><span class="tag">${esc(p.difficulty)}</span><span class="tag">${S.solved[p.id]?'Megfejtve':'Nyitott'}</span></div><button class="btn" data-puzzle="${p.id}">${S.solved[p.id]?'Megoldás megtekintése':'Feladvány megnyitása'}</button></div>`)).join(''):(()=>{let p=PUZZLES.find(x=>x.id===activePuzzle);return box(`<div class="puzzle-detail"><div class="row space"><h2>${esc(p.title)}</h2><button class="btn alt" id="back">Vissza</button></div><p class="muted">${esc(p.mechanic)} · ${esc(p.difficulty)}</p>${p.cards.map((c,i)=>`<div class="case"><b>${esc(c.label)}</b><p>${esc(c.prompt)}</p></div>`).join('')}${S.solved[p.id]?note('<b>Megfejtve.</b> A jutalominformáció a bizonyítéktárban olvasható.'):`<label>Megfejtés</label><input class="field" id="answer" autocomplete="off" placeholder="Írd be a kódot"><button class="btn" id="check">Ellenőrzés</button><p id="answerMsg" role="status"></p><details><summary>Fokozatos segítség</summary>${p.hints.map((hint,i)=>`<button class="btn alt" data-hint="${i}">Súgó ${i+1}</button>`).join(' ')}<p id="hintText"></p></details>`}</div>`)})())}
if(page==='boxes')h='<h1>Fizikai ládák</h1>'+note('A ládák valódi számzáras lakattal működnek. Kód megfejtése → saját boríték kivétele → láda visszazárása és számok elforgatása → átvétel igazolása.')+BOXES.map(b=>{let unlocked=mins()>=b.at,passed=S.boxCodes[b.id],rec=S.received[b.id];return box(`<div class="row space"><h2>${b.id}. láda · ${esc(b.name)}</h2><span class="tag">${rec?'Átvéve':passed?'Kód helyes':unlocked?'Elérhető':'Időzáras'}</span></div><p>Időkapu: a játék <b>${b.at}. percétől</b>. ${unlocked?'A kód megadható.':'Hátralévő idő az időkapuig: '+Math.max(0,b.at-mins())+' perc.'}</p>${!unlocked?'<p class="muted">A ládához tartozó külön papíralapú kódfejtő feladat a végleges nyomtatási csomag része lesz.</p>':!passed?`<label>Megfejtett lakatkód</label><input class="field" id="box-${b.id}" inputmode="numeric" placeholder="Számkombináció"><button class="btn" data-box="${b.id}">Kód ellenőrzése</button><p id="boxmsg-${b.id}" role="status"></p>`:rec?note('A csapat borítékja átvéve; a digitális dokumentumjegyzék megnyílt.'):note('A kód helyes. Nyisd ki a fizikai ládát, vedd ki a saját borítékodat, majd zárd vissza és forgasd el a számokat!')+`<button class="btn" data-receive="${b.id}">Igazolom: átvettem és visszazártam</button>`}`)}).join('');
if(page==='evidence')h='<h1>Bizonyítéktár</h1>'+note('A digitális fejtörők jutalmai itt jelennek meg. A fizikai ládák iratai csak az átvétel igazolása után hozzáférhetők; a jelenlegi demóban az iratjegyzék szerepel, nem a végleges iratszöveg.')+'<h2 class="subtle">Digitális nyomok</h2>'+ (PUZZLES.filter(p=>S.solved[p.id]).map(p=>box(`<h2>${esc(p.id)} · ${esc(p.title)}</h2><p>${esc(p.reward)}</p>`)).join('')||box('<p>Még nincs megszerzett digitális bizonyíték.</p>'))+'<h2 class="subtle">Fizikai iratcsomagok</h2>'+(BOXES.filter(b=>S.received[b.id]).map(b=>box(`<h2>${b.id}. láda · ${esc(b.name)}</h2>${b.files.map(x=>`<div class="proof">${esc(x)}</div>`).join('')}<p class="muted mini">A tényleges, teljes iratszövegeket a nyomtatott csomaggal történő egyeztetés után kapcsoljuk ide.</p>`)).join('')||box('<p>Még nem igazoltál vissza borítékátvételt.</p>'));
if(page==='notes')h=box('<h2>Nyomozati napló</h2><p>Írjátok ide az időrendet, a gyanúsítottak alibijét és a bizonyítékok közötti kapcsolatokat.</p><textarea id="notes" class="field" placeholder="Nyomozati jegyzetek...">'+esc(S.notes)+'</textarea><button class="btn" id="saveNotes">Jegyzetek mentése</button><p class="muted mini">Helyi mentés ezen a készüléken.</p>');
if(page==='accuse')h=box('<h2>Végső vádelmélet</h2><p>A vádelméletet a bizonyítékok alapján állítsátok össze. Ez a demó nem pontoz automatikusan.</p><label>Kit tartotok tettesnek?</label><select class="field" id="accused">'+['',...PEOPLE.map(x=>x[0])].map(n=>`<option value="${esc(n)}" ${S.accused===n?'selected':''}>${esc(n||'Válasszatok')}</option>`).join('')+'</select><label>Indíték, időrend, bizonyítékok</label><textarea id="accusation" class="field">'+esc(S.accusation)+'</textarea><button class="btn" id="saveAcc">Vádelmélet mentése</button>');
if(page==='settings')h=box(`<h2>Beállítások és próbaüzem</h2><label>Csapat neve (ezen a készüléken)</label><input class="field" id="team" value="${esc(S.team)}"><button class="btn" id="saveTeam">Csapatnév mentése</button><hr class="divider"><h3>Próbaóra</h3><p>Eltelt: ${mins()} perc · Hátralévő: ${remaining()} perc</p>${S.started?`<button class="btn alt" id="pause">${S.pausedAt?'Folytatás':'Szünet'}</button> <button class="btn alt" id="advance">+ 15 perc teszt</button>`:'<button class="btn" id="start">Játék indítása</button>'}<hr class="divider"><h3>Demó-adatok</h3><p class="muted">A visszaállítás törli a helyi megfejtéseket és jegyzeteket. Nem érinti a többi telefont.</p><button class="btn alt" id="reset">Helyi demó nullázása</button><hr class="divider"><p class="mini muted">Ez nem éles jogosultságkezelés, nem játékmesteri felület és nem többeszközös szinkronizáció. A ládakódok a kliensoldali demóban szerepelnek, ezért nem titkosak. Éles kiadásban szerveroldali ellenőrzés szükséges.</p>`);
app.innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-puzzle]').forEach(b=>b.onclick=()=>{activePuzzle=b.dataset.puzzle;render()});let back=document.getElementById('back');if(back)back.onclick=()=>{activePuzzle=null;render()};let check=document.getElementById('check');if(check)check.onclick=()=>{let p=PUZZLES.find(x=>x.id===activePuzzle);let val=document.getElementById('answer').value;if(norm(val)===norm(p.code)){S.solved[p.id]=true;save();render()}else document.getElementById('answerMsg').textContent='Ez még nem a keresett megfejtés. Ellenőrizzétek a feltételeket.'};document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{let p=PUZZLES.find(x=>x.id===activePuzzle),i=+b.dataset.hint;document.getElementById('hintText').textContent=p.hints[i]});document.querySelectorAll('[data-box]').forEach(b=>b.onclick=()=>{let id=+b.dataset.box,x=BOXES.find(x=>x.id===id);if(mins()<x.at)return;if(document.getElementById('box-'+id).value.trim()===x.code){S.boxCodes[id]=true;save();render()}else document.getElementById('boxmsg-'+id).textContent='Nem megfelelő számkombináció.'});document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>{let id=+b.dataset.receive;if(!confirm('Kivetted a saját borítékodat, visszazártad a lakatot, és elforgattad a számokat?'))return;S.received[id]=true;save();render()});let start=document.getElementById('start');if(start)start.onclick=()=>{S.started=Date.now();S.pausedAt=null;S.pausedTotal=0;save();render()};let pause=document.getElementById('pause');if(pause)pause.onclick=()=>{if(S.pausedAt){S.pausedTotal+=Date.now()-S.pausedAt;S.pausedAt=null}else S.pausedAt=Date.now();save();render()};let advance=document.getElementById('advance');if(advance)advance.onclick=()=>{S.started-=15*60000;save();render()};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Biztosan törlöd ezen a készüléken a demóadatokat?')){S=blank();save();page='home';render()}};let st=document.getElementById('saveTeam');if(st)st.onclick=()=>{S.team=document.getElementById('team').value.trim().slice(0,50)||'A csapat';save();render()};let sn=document.getElementById('saveNotes');if(sn)sn.onclick=()=>{S.notes=document.getElementById('notes').value;save();alert('A jegyzetek ezen a készüléken mentve.')};let sa=document.getElementById('saveAcc');if(sa)sa.onclick=()=>{S.accused=document.getElementById('accused').value;S.accusation=document.getElementById('accusation').value;save();alert('A vádelmélet ezen a készüléken mentve.')}}
function network(){document.getElementById('net').textContent=navigator.onLine?'● Online':'● Offline'}window.addEventListener('online',network);window.addEventListener('offline',network);network();setInterval(()=>{if(page==='home'&&S.started){let e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(remaining()/60)).padStart(2,'0')+':'+String(remaining()%60).padStart(2,'0')+':00'}},10000);render();
</script></body></html>
