<!doctype html>
<html lang="hu">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Játékmester · Nyomozóiroda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ============================================================
   Nyomozóiroda — közös stílus
   Témák (az ügyfájl "tema" mezője): noir1920 · vadasz · modern · borzongos
   Betűk: felület = a telefon rendszerbetűje · nagy címek = díszbetű · iratok = könyvbetű, írógép, kézírás
   ============================================================ */
:root, html[data-skin="noir1920"]{
  --bg:#15241c; --bg-2:#1d3127; --bg-3:#26402f; --bg-ink:#f7f0de; --bg-muted:#cfc3a6; --bg-line:#3b5444;
  --paper:#fcf7ea; --paper-2:#f2e9d2; --ink:#1b1812; --muted:#5a5142; --line:#d6c7a6;
  --accent:#8a5f1f; --accent-ink:#fffaf0; --accent-soft:#f1dfb6; --stamp:#a3312a; --ok:#2c6a43; --ok-soft:#dcebd9; --hl:#f3dc9c;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-doc:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-type:"Courier Prime", "Courier New", Courier, monospace;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
}
html[data-skin="vadasz"]{
  --bg:#1e2a1b; --bg-2:#283724; --bg-3:#33452e; --bg-ink:#f4efe0; --bg-muted:#c6c8ab; --bg-line:#4a5a41;
  --paper:#f7f2e4; --paper-2:#ece3cb; --ink:#1d1b15; --muted:#575343; --line:#cdbf9f;
  --accent:#7a4c1f; --accent-ink:#fff8ec; --accent-soft:#ecd9b4; --stamp:#8e2b1f; --ok:#36643c; --ok-soft:#dde9d8; --hl:#ead7a0;
  --f-display:"Cormorant Garamond", Garamond, Georgia, serif;
}
html[data-skin="modern"]{
  --bg:#eef1f5; --bg-2:#e2e7ee; --bg-3:#d5dce6; --bg-ink:#111821; --bg-muted:#4d5a69; --bg-line:#c4cdd8;
  --paper:#ffffff; --paper-2:#f3f5f8; --ink:#111821; --muted:#4d5a69; --line:#d7dde5;
  --accent:#1d55b0; --accent-ink:#ffffff; --accent-soft:#dbe6f8; --stamp:#c0392b; --ok:#1e7a4a; --ok-soft:#dcf0e3; --hl:#fff0b3;
  --f-display:"Archivo", system-ui, sans-serif;
}
html[data-skin="borzongos"]{
  --bg:#140f10; --bg-2:#1f1718; --bg-3:#2b2021; --bg-ink:#f1e6da; --bg-muted:#bda998; --bg-line:#433435;
  --paper:#f1e8dc; --paper-2:#e4d7c5; --ink:#1b1312; --muted:#5d4b44; --line:#c6b09a;
  --accent:#8b1e2d; --accent-ink:#fff4ee; --accent-soft:#ecd0c8; --stamp:#8b1e2d; --ok:#3d6b46; --ok-soft:#dde8db; --hl:#ead0a4;
  --f-display:"IM Fell English", Georgia, serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--bg-ink);font-family:var(--f-ui);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400}
h2,h3{font-family:var(--f-ui);font-weight:700}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

/* ---------- Gombok, mezők ---------- */
.gomb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:13px 20px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;line-height:1.2;text-align:center;text-decoration:none}
.gomb.masod{background:transparent;color:inherit;border-color:currentColor}
.gomb.halk{background:transparent;border-color:transparent;color:inherit;min-height:44px;padding:8px 10px}
.gomb.veszely{background:var(--stamp);border-color:var(--stamp);color:#fff}
.gomb.teljes{width:100%}
.gomb svg{width:20px;height:20px;flex:0 0 20px}
.gomb:disabled{opacity:.45;cursor:not-allowed}
.gomb:active:not(:disabled){transform:translateY(1px)}
.mezo{width:100%;min-height:58px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:#16130e;font-size:20px}
.mezo:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.mezo.kod{font-family:var(--f-type);font-weight:700;letter-spacing:.3em;text-align:center;font-size:30px}
textarea.mezo{min-height:150px;font-size:18px;line-height:1.5}
label.cimke{display:block;font-weight:700;margin:14px 0 6px}

/* ---------- Lap (kártya) ---------- */
.lap{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 20px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:12px;min-width:0}
.lap h2{font-size:24px}
.lap h3{font-size:20px}
.lap .halv,.halv{color:var(--muted)}
.kicsi{font-size:15px}
.felirat{font-family:var(--f-ui);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cimke-pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--paper-2);color:var(--muted);white-space:nowrap}
.sor{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sor.szet{justify-content:space-between}
.oszlop{display:flex;flex-direction:column;gap:14px}
.racs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.racs > *{min-width:0}
.ertesites{padding:14px 16px;border-radius:12px;background:var(--hl);color:#2b2112;border:1px solid rgba(0,0,0,.1)}
.ertesites.hiba{background:#f7d9d1;color:#4a1a12}
.ertesites.ok{background:var(--ok-soft);color:#173b20}

/* ============================================================
   IRATOK — telefonon és nyomtatásban
   ============================================================ */
.irat{position:relative;background:#fbf6e8;color:#1f1a12;border:1px solid #cdbf9f;padding:22px 20px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;break-inside:avoid;page-break-inside:avoid;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:var(--f-doc)}
.irat .i-szoveg{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.6}
.irat .i-fej{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-type);font-weight:700;letter-spacing:.14em;font-size:14px;border-bottom:2px solid #1f1a12;padding-bottom:6px}
.irat .i-cim{font-family:var(--f-doc);font-weight:600;font-size:20px;line-height:1.3}
.irat .i-meta{font-family:var(--f-type);font-size:14px;color:#5b4f3a}
.irat .i-azon{position:absolute;top:6px;right:10px;font-family:var(--f-type);font-size:11px;color:#8a7b60}
.irat .i-alairas{font-family:var(--f-hand);font-size:27px;line-height:1.1;align-self:flex-end;margin-top:6px;border-top:1px solid #8a7b60;padding:4px 18px 0}
.irat .i-pecset{position:absolute;right:20px;bottom:24px;width:96px;height:96px;border:3px double rgba(140,30,30,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-14deg);pointer-events:none}
.irat .i-pecset span{font-family:var(--f-type);font-size:10.5px;font-weight:700;letter-spacing:.04em;color:rgba(140,30,30,.65);text-align:center;line-height:1.2;padding:8px;text-transform:uppercase}

/* írógépes hatás: a fejléc írógép, a szöveg jól olvasható könyvbetű */
.i-jegyzokonyv,.i-dokumentum{background:#fbf7ec}
.i-jegyzokonyv .i-szoveg,.i-dokumentum .i-szoveg,.i-nyugta .i-szoveg{font-family:var(--f-doc)}
.i-vallomas .i-szoveg{font-style:italic}
.i-tavirat{background:#f2e7c9;border:2px solid #a8915f}
.i-tavirat .i-fej{color:#7a2a1e;border-color:#7a2a1e}
.i-tavirat .i-szoveg{font-family:var(--f-type);font-size:17px;letter-spacing:.04em;background:#fffaf0;padding:10px 12px;border:1px solid #c9b88f}
.i-level{background:#fdf9ef}
.i-level .i-szoveg{font-style:italic;font-size:19px}
.i-level .i-datum{font-style:italic;align-self:flex-end;color:#4b3f2c}
.i-naplo .i-szoveg,.i-feljegyzes .i-szoveg{font-family:var(--f-hand);font-size:27px;line-height:1.25}
.i-naplo .i-datum,.i-feljegyzes .i-datum{font-family:var(--f-hand);font-size:24px;align-self:flex-end}
.i-naplo .i-cim,.i-feljegyzes .i-cim{font-family:var(--f-hand);font-size:28px;font-weight:700}
.i-naplo{background:repeating-linear-gradient(#fbf6e8 0 33px,#c9d3dd 33px 34px);background-color:#fbf6e8;border-left:4px double #b94a3c}
.i-feljegyzes{background:#f7eebf;transform:rotate(-.5deg)}
.i-nyugta{border-style:dashed}
.i-ujsag{background:#efe8d6}
.i-ujsag .i-ujsagfej{font-family:var(--f-type);font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-bottom:3px double #1f1a12;padding-bottom:6px}
.i-ujsag .i-ujsagcim{font-family:var(--f-display);font-size:28px;line-height:1.15}
.i-ujsag .i-szoveg{font-size:17px;column-width:240px;column-gap:20px;text-align:justify;hyphens:auto}
.i-fenykep{background:#fdfbf5;padding:14px 14px 18px}
.i-fenykep .i-foto{border:1px solid #b9a77f}
.i-fenykep .i-foto svg,.i-fenykep .i-foto img,.i-helyszinrajz .i-foto svg{display:block;width:100%;height:auto}
.i-fenykep .i-felirat{font-family:var(--f-hand);font-size:26px;line-height:1.2;text-align:center}
.i-fenykep .i-hatul{font-size:17px;color:#4b3f2c;border-top:1px dashed #b9a77f;padding-top:8px;font-style:italic}
.i-helyszinrajz .rajz svg{display:block;width:100%;height:auto;border:1px solid #b9a77f}
.i-helyszinrajz .jelmagy{margin:8px 0 0;padding-left:0;list-style:none;font-size:16px;display:grid;gap:4px}
.i-egett{border:none;-webkit-mask-image:radial-gradient(130% 130% at 50% 45%,#000 60%,transparent 78%);mask-image:radial-gradient(130% 130% at 50% 45%,#000 60%,transparent 78%);background:radial-gradient(120% 120% at 50% 45%,#fbf6e8 52%,#c79a5c 70%,#3b2410 82%)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-size:17px}
.keret{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.fej{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.fej h1{font-size:clamp(28px,5vw,40px)}
.fulek{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--bg-ink);scrollbar-width:none}
.fulek button{border:1px solid var(--bg-line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg-2);color:var(--bg-muted);padding:11px 16px;font-weight:700;white-space:nowrap}
.fulek button[aria-selected="true"]{background:var(--bg-ink);color:var(--bg);border-color:var(--bg-ink)}
.lap{font-size:17px}
.nagyora{font-family:var(--f-type);font-weight:700;font-size:clamp(48px,9vw,80px);font-variant-numeric:tabular-nums;line-height:1}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-type);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.sz,th.sz{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablaburok{overflow-x:auto}
.most{background:var(--hl)}
.mult{opacity:.5}
.kod{font-family:var(--f-type);font-weight:700;letter-spacing:.2em;color:var(--stamp)}
.mezo{font-size:18px;min-height:50px}
.gomb{font-size:17px;min-height:50px}
details summary{cursor:pointer;font-weight:700}
pre.szoveg{white-space:pre-wrap;font-family:var(--f-type);font-size:15px;margin:0;background:var(--paper-2);padding:12px;border-radius:8px}
/* Kivetítő */
#kivetito{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--bg-ink);overflow:auto;padding:max(28px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) 28px max(32px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:32px}
#kivetito h1{font-size:clamp(36px,6vw,80px)}
#kivetito .nagyora{font-size:clamp(80px,13vw,190px);color:var(--hl);white-space:nowrap}
#kivetito .k-racs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px}
#kivetito .k-cimke{font-family:var(--f-type);letter-spacing:.16em;text-transform:uppercase;color:var(--bg-muted);font-size:clamp(14px,1.4vw,20px)}
#kivetito .k-nagy{font-size:clamp(26px,3.2vw,46px);line-height:1.25}
#kivetito .k-kod{font-family:var(--f-type);font-weight:700;font-size:clamp(60px,10vw,140px);letter-spacing:.2em;color:var(--hl);line-height:1}
#kivetito .k-bejel{font-family:var(--f-display);font-style:italic;font-size:clamp(28px,4vw,60px);border-left:6px solid var(--stamp);padding-left:24px}
#kivetito table td{font-size:clamp(20px,2.4vw,34px);border-color:var(--bg-line);color:var(--bg-ink)}
#kivetito .bezar{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));opacity:.4}
#kivetito .bezar:hover{opacity:1}

/* ---------- NYOMTATÁS ---------- */
.nyomlap{background:#fff;color:#111;padding:28px;border:1px solid #ccc;display:flex;flex-direction:column;gap:14px}
.nyomlap h2{font-family:var(--f-display);font-size:30px;color:#111}
.nyomlap h3{font-size:20px;margin-top:6px}
.nyomlap .fejsav{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-type);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid #111;padding-bottom:6px}
.nyomlap .fejsav b{color:#a3312a}
.nyomlap .iratok{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.nyomlap .iratok .irat{box-shadow:none}
.nyomlap .iratok .i-fenykep,.nyomlap .iratok .i-helyszinrajz{grid-column:span 1}
.cimkelap{align-items:center;justify-content:center;text-align:center;min-height:60vh;gap:22px;border:6px double #111}
.cimkelap .nagyszam{font-family:var(--f-type);font-weight:700;font-size:90px;line-height:1}
.cimkelap h2{font-size:52px}
.qrhely{display:flex;justify-content:center}
.qrhely img,.qrhely canvas{width:260px;height:260px}
@media print{
  @page{margin:12mm}
  body{background:#fff!important}
  .keret>*:not(#nyomtatasHely), #nyomtatasHely>.vezerlo{display:none!important}
  .keret{padding:0;max-width:none}
  #nyomtatasHely{display:block!important}
  .nyomlap{border:0;padding:0;break-after:page;page-break-after:always}
  .nyomlap:last-child{break-after:auto}
  .irat{box-shadow:none!important}
}

<script type="module">
const KOZOS = (() => {

// Közös segédfüggvények — a böngésző (csapat-app, játékmesteri konzol) és a build script (Node) is ezt használja.
// Semmi DOM-függés nincs benne, így Node 18+ alatt is fut.

const subtle = globalThis.crypto.subtle;
const enc = new TextEncoder();
const dec = new TextDecoder();

const ITER_KARTYA = 60000;   // egy fejtörő-kártya válaszának ellenőrzése
const ITER_TITOK = 120000;   // jutalom / ládatartalom titkosítása a megfejtéssel
const ITER_JM = 200000;      // játékmesteri rész titkosítása jelszóval

/** Válasz egységesítése: ékezet, szóköz, írásjel nélkül, nagybetűvel. "22:05" → "2205", "Rózsakert" → "ROZSAKERT". */
function norm(x) {
  return String(x ?? "")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toUpperCase().replace(/[^A-Z0-9]/g, "");
}

const b64 = {
  to(buf) {
    const bytes = new Uint8Array(buf); let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  },
  from(str) {
    const s = atob(str); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
};

function veletlenSo(n = 16) {
  const a = new Uint8Array(n); globalThis.crypto.getRandomValues(a); return b64.to(a);
}

async function pbkdf2Bits(jelszo, so, iter) {
  const kulcs = await subtle.importKey("raw", enc.encode(jelszo), "PBKDF2", false, ["deriveBits"]);
  return subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(so), iterations: iter, hash: "SHA-256" }, kulcs, 256);
}
async function aesKulcs(jelszo, so, iter) {
  const bits = await pbkdf2Bits(jelszo, so, iter);
  return subtle.importKey("raw", bits, "AES-GCM", false, ["encrypt", "decrypt"]);
}

/** Kártyaválasz lenyomata. */
async function lenyomat(valasz, so) {
  return b64.to(await pbkdf2Bits(norm(valasz), so, ITER_KARTYA));
}
async function egyezik(valasz, so, hash) {
  if (!norm(valasz)) return false;
  return (await lenyomat(valasz, so)) === hash;
}

/** Tetszőleges JSON titkosítása jelszóval (AES-GCM). */
async function titkosit(adat, jelszo, so, iter) {
  const iv = new Uint8Array(12); globalThis.crypto.getRandomValues(iv);
  const k = await aesKulcs(jelszo, so, iter);
  const ct = await subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(JSON.stringify(adat)));
  return { iv: b64.to(iv), ct: b64.to(ct) };
}
/** Visszafejtés. Rossz jelszónál null-t ad (nem dob). */
async function visszafejt(csomag, jelszo, so, iter) {
  try {
    const k = await aesKulcs(jelszo, so, iter);
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: b64.from(csomag.iv) }, k, b64.from(csomag.ct));
    return JSON.parse(dec.decode(pt));
  } catch (e) { return null; }
}

/** A fejtörő teljes kulcsa: a kártyák válaszai sorrendben. */
const fejtoroKulcs = valaszok => valaszok.map(norm).join("|");

/* ---------- Eredménykód: a csapat telefonja ezt mutatja a végén, a játékmester beírja ---------- */
const ABC = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"; // 32 jel, könnyen olvasható (nincs 0/O, 1/I)
function ellenorzo(n, sz) { let h = 7; for (const c of String(n) + sz) h = (h * 31 + c.charCodeAt(0)) % 1024; return h; }
/** pont: 0–1023, valasztasok: 4 db 0–7 közötti index (tettes, indíték, fegyver, időpont), sorszam: a csapat 1–31 */
function eredmenyKod(pont, valasztasok, so = "") {
  const p = Math.max(0, Math.min(1023, Math.round(pont)));
  const v = valasztasok.map(x => Math.max(0, Math.min(7, x | 0)));
  let n = p; for (const x of v) n = n * 8 + x;            // 10 + 12 bit
  const c = ellenorzo(n, so);                               // 10 bit
  let big = n * 1024 + c, s = "";
  for (let i = 0; i < 7; i++) { s = ABC[big % 32] + s; big = Math.floor(big / 32); }
  return s.slice(0, 3) + "-" + s.slice(3);
}
function eredmenyKodOlvas(kod, so = "") {
  const s = String(kod || "").toUpperCase().replace(/[^0-9A-Z]/g, "");

    if (!(p.sugok || []).length) f(`${p.id}: nincs súgó`);
    (p.jutalom || []).forEach(d => iratEll(d, `${p.id} jutalma`));
  });
  if (!(u.ladak || []).length) f("nincs láda — a játék ládák nélkül is működik");
  let elozo = -1;
  (u.ladak || []).forEach(l => {
    kell(l, ["id", "nev", "nyilik", "szamjegy", "kod", "rejtveny", "iratok"], `láda ${l.id || "?"}`);

    else if (kod.length !== +l.szamjegy) h(`${l.id}: a kód ${kod.length} jegyű, de a lakat ${l.szamjegy} jegyű`);
    if (+l.nyilik < elozo) f(`${l.id}: korábban nyílik, mint az előző láda`);
    if (+l.nyilik >= +u.idotartam) h(`${l.id}: a játék vége után nyílna`);

    (l.iratok || []).forEach(d => iratEll(d, `${l.id} iratai`));
  });
  (u.vadirat?.kerdesek || []).forEach(q => {
    if (!["tettes", "inditek", "fegyver", "ido"].includes(q.id)) h(`vádirat: ismeretlen kérdés „${q.id}” (tettes / inditek / fegyver / ido)`);

  });
  if ((u.vadirat?.kerdesek || []).length !== 4) h("a vádiratban pontosan 4 kérdés kell: tettes, inditek, fegyver, ido");
  return { hibak, figy };
}

async function csomagol(u, JELSZO) {

    const titok = await K.titkosit({ jutalom: p.jutalom, magyarazat: p.magyarazat }, K.fejtoroKulcs(p.kartyak.map(c => c.valasz)), so, K.ITER_TITOK);
    fejtorok.push({ id: p.id, cim: p.cim, felvonas: p.felvonas || 1, nyilik: +p.nyilik || 0, nehezseg: p.nehezseg, mechanika: p.mechanika || "", kartyak, sugok: p.sugok || [], so, titok });
  }
  const ladak = [];
  for (const l of u.ladak || []) {
    const so = K.veletlenSo();
    const titok = await K.titkosit({ iratok: l.iratok, magyarazat: l.rejtveny.magyarazat }, K.norm(l.kod), so, K.ITER_TITOK);
    ladak.push({ id: l.id, nev: l.nev, hely: l.hely || "", nyilik: +l.nyilik, szamjegy: +l.szamjegy,
      rejtveny: { cim: l.rejtveny.cim, szoveg: l.rejtveny.szoveg, sugok: l.rejtveny.sugok || [] },
      iratDb: (l.iratok || []).length, so, hash: await K.lenyomat(l.kod, so + ":lada"), titok });
  }
  const jmSo = K.veletlenSo();
  const jm = await K.titkosit(u, JELSZO, jmSo, K.ITER_JM);
  return {
    formatum: 1, id: u.id, cim: u.cim, alcim: u.alcim, tema: u.tema, jatekosok: u.jatekosok || "", idotartam: +u.idotartam, sorrend: u.sorrend ?? 0,
    korszak: u.korszak || "", helyszin: u.helyszin || "", bevezeto: u.bevezeto, megbizas: u.megbizas,
    aldozat: u.aldozat,

    dosszie: u.dosszie, fejtorok, ladak,

    pontozas: u.pontozas,
    jm: { so: jmSo, ...jm }
  };
}

const UGYLISTA = (() => {
const { listaSor } = CSOMAG;
// Az elérhető ügyek listája.
// GitHub Pages-en közvetlenül a repó "ugyek" mappáját olvassa (GitHub API), így egy új fájl feltöltése után
// build nélkül megjelenik (a GitHub gyorsítótára miatt legfeljebb kb. 10 perc alatt).
// Máshol (helyi próba, bemutató) az ugyek/lista.json fájlt használja.

function githubRepo() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const elso = location.pathname.split("/").filter(Boolean)[0];
  const repo = elso && !elso.includes(".") ? elso : owner + ".github.io";
  return { owner, repo };
}

const gyorstar = new Map();
/** Egy ügyfájl betöltése (a lista már betöltötte, ha lehet) */
async function ugyFajl(sor) {
  const fajl = sor.fajl || sor.id + ".json";
  if (gyorstar.has(fajl)) return gyorstar.get(fajl);
  const r = await fetch(fajl.split("/").map(encodeURIComponent).join("/"), { cache: "no-cache" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const u = await r.json(); gyorstar.set(fajl, u); return u;
}

async function ugyLista() {
  const gh = githubRepo();
  if (gh) {
    try {
      // a gyökérben és az ugyek mappában is keresünk (telefonos feltöltésnél a mappák elveszhetnek)
      const helyek = ["", "ugyek"];
      const listak = await Promise.all(helyek.map(async h => {
        const r = await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${h}`, { headers: { Accept: "application/vnd.github+json" } });
        return r.ok ? await r.json() : null;
      }));
      if (listak.some(Boolean)) {
        const fajlok = listak.filter(Array.isArray).flat().filter(f => f.type === "file" && f.name.endsWith(".json") && f.name !== "lista.json" && f.name !== "package.json");
        const sorok = await Promise.all(fajlok.map(async f => {
          try { const u = await ugyFajl({ fajl: f.path }); return u.formatum === 1 && u.jm ? { ...listaSor(u), fajl: f.path } : null; }
          catch (e) { return null; }
        }));
        const egyedi = new Map(); sorok.filter(Boolean).forEach(x => { if (!egyedi.has(x.id)) egyedi.set(x.id, x); });
        return [...egyedi.values()].sort((a, b) => (b.sorrend - a.sorrend) || a.cim.localeCompare(b.cim, "hu"));
      }
    } catch (e) { /* tovább a lista.json-ra */ }
  }
  for (const hely of ["ugyek/lista.json", "lista.json"]) {
    try {
      const r = await fetch(hely, { cache: "no-cache" });
      if (r.ok) { const elotag = hely.startsWith("ugyek/") ? "ugyek/" : ""; return ((await r.json()).ugyek || []).map(x => ({ ...x, fajl: x.fajl && x.fajl.includes("/") ? x.fajl : elotag + (x.fajl || x.id + ".json") })); }
    } catch (e) {}
  }
  return [];
}

return { githubRepo, ugyFajl, ugyLista };
})();

    <p>Minden ládába tegyél <b>${T} borítékot</b> (csapatonként egyet). A borítékokra írd rá a láda nevét. A lakatot állítsd a kódra, zárd be, és keverd össze a számokat.</p>
    <table><tr><th>Láda</th><th>Kód</th><th>Hová</th><th>Nyílik</th><th>Borítékba</th></tr>${G.ladak.map(l => `<tr><td><b>${esc(l.nev)}</b></td><td class="kod" style="font-size:22px">${esc(l.kod)}</td><td>${esc(l.hely)}</td><td>${ido(l.nyilik)}</td><td>${l.iratok.map(d => esc(d.cim)).join("<br>")}</td></tr>`).join("")}</table>`));
  // 3. Belépő plakát QR-kóddal
  lapok.push(lap("Plakát a csapatoknak", "1–2 példány", `<div class="cimkelap" style="border:0;min-height:auto"><h2>${esc(G.cim)}</h2><p style="font-size:22px">Nyissátok meg a telefonon, csapatonként egyet:</p><div class="qrhely" data-qr="${esc(appCim(""))}" data-meret="260"></div><p class="kod" style="font-size:16px;letter-spacing:.02em;word-break:break-all">${esc(appCim(""))}</p><p style="font-size:20px">Az indítókódot a játékmester mondja be, vagy a kivetítőn lévő QR-kódban van.</p></div>`));
  // 4. Láda-címkék
  G.ladak.forEach((l, i) => lapok.push(lap("Címke a ládára", "1 példány", `<div class="cimkelap"><div class="nagyszam">${i + 1}.</div><h2>${esc(l.nev)}</h2><p style="font-size:24px">Időzár: a játék <b>${l.nyilik}. percétől</b> nyitható.</p><p style="font-size:20px">Csak a saját csapatotok borítékát vegyétek ki!<br>Zárjátok vissza, és keverjétek össze a számokat.</p></div>`)));
  // 5. Borítékok tartalma
  G.ladak.forEach(l => { for (let k = 1; k <= T; k++) lapok.push(lap(`Boríték · ${l.nev}`, `${k}/${T}. példány`, `<div class="iratok">${l.iratok.map(d => irat(d)).join("")}</div>`)); });
  // 6. Dosszié papíron (opcionális)
  if (nyomDosszie) for (let k = 1; k <= T; k++) lapok.push(lap("Dosszié", `${k}/${T}. példány`, `<h2>${esc(G.cim)}</h2><p style="white-space:pre-wrap">${esc(G.bevezeto)}</p><p><b>A megbízás:</b> ${esc(G.megbizas)}</p>
    <table><tr><th>Gyanúsított</th><th>Kapcsolat</th><th>Leírás</th></tr>${G.gyanusitottak.map(g => `<tr><td><b>${esc(g.nev)}</b></td><td>${esc(g.kapcsolat)}</td><td>${esc(g.leiras)}</td></tr>`).join("")}</table>
    <div class="iratok">${G.dosszie.map(d => irat(d)).join("")}</div>`));
  const jatekos = nyomResz === "jatekos";
  const mutat = jatekos ? lapok : titkos;
  return `<div id="nyomtatasHely" class="oszlop">
    <div class="lap vezerlo"><span class="felirat halv">Nyomtatható csomag</span>
      <div class="sor" role="group" aria-label="Mit nyomtatsz?">
        <button class="gomb ${jatekos ? "" : "masod"}" data-nyomresz="jatekos">Játékos anyagok</button>
        <button class="gomb ${jatekos ? "masod" : ""}" data-nyomresz="jm">Játékmesteri lapok (titkos)</button></div>
      ${jatekos ? `<p class="ertesites ok"><b>Megoldás nélkül.</b> Borítékok tartalma, ládacímkék és QR-plakát — ezek kerülnek a játékosokhoz.</p>
        <div class="sor"><label class="cimke" for="csapatDb" style="margin:0">Csapatok száma</label><input class="mezo" id="csapatDb" type="number" min="1" max="12" value="${T}" style="width:110px">
        <label class="sor" style="gap:8px"><input type="checkbox" id="nyomDosszie" ${nyomDosszie ? "checked" : ""} style="width:22px;height:22px"> a dosszié papíron is</label></div>
        <p>${mutat.length} oldal. A borítéktartalmak csapatonként külön oldalon vannak: ki kell nyomtatni, és borítékba tenni. A fényképeket érdemes színesben, vastagabb papírra.</p>`
      : `<p class="ertesites hiba"><b>Titkos!</b> Ezeken a megoldás, a ládakódok és a forgatókönyv van. Csak neked szól, ne kerüljön a játékosok közé.</p><p>${mutat.length} oldal.</p>`}
      <div class="sor"><button class="gomb" data-act="nyomtat">Nyomtatás</button><span class="kicsi halv">A nyomtatási ablakban „Mentés PDF-be” is választható.</span></div>
    </div>
    ${mutat.join("")}
  </div>`;
}
const appCim = kod => location.origin + location.pathname.replace(/jatekmester\.html$/, "") + "?ugy=" + encodeURIComponent(G.id) + (kod ? "&kod=" + kod : "");
/** Minden üres [data-qr] helyre QR-kódot rajzol */
function qrRajzol(gyoker = document) {
  if (!window.QRCode) return;
  gyoker.querySelectorAll("[data-qr]").forEach(hely => {
    if (hely.dataset.kesz === hely.dataset.qr) return;
    hely.innerHTML = ""; hely.dataset.kesz = hely.dataset.qr;
    const m = +hely.dataset.meret || 220;
    try { new QRCode(hely, { text: hely.dataset.qr, width: m, height: m, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  });
}

/* --- Eredmények --- */
function vadPont(valasztasok) {
  const pv = G.pontozas.vadirat || {}; let p = 0; const reszl = [];
  G.vadirat.kerdesek.forEach((q, i) => { const jo = valasztasok[i] === q.helyes; if (jo) p += pv[q.id] || 0; reszl.push(jo); });
  return { p, reszl };
}
function ranglista() {
  return [...(J.eredmenyek || [])].map(e => { const v = vadPont(e.valasztasok); return { ...e, vad: v.p, reszl: v.reszl, ossz: e.pont + v.p }; }).sort((a, b) => b.ossz - a.ossz);
}
function eredmenyek() {
  const r = ranglista();
  return `
  <section class="lap" style="max-width:720px"><span class="felirat halv">Eredménykód beírása</span>
    <p>Amikor egy csapat leadja a vádiratot, a telefonjuk egy kódot mutat (pl. <span class="kod">K7M-Q2XP</span>). Írd be ide a csapatnévvel együtt.</p>
    <form class="oszlop" id="eredmenyUrlap" autocomplete="off" style="gap:10px">
      <div class="sor"><input class="mezo" id="eCsapat" placeholder="Csapatnév" style="flex:1;min-width:180px"><input class="mezo" id="eKod" placeholder="XXX-XXXX" style="flex:1;min-width:160px;font-family:var(--f-type);letter-spacing:.15em;text-transform:uppercase"></div>
      <button class="gomb" type="submit">Hozzáadás</button><p class="ertesites hiba" id="eHiba" hidden></p></form>
  </section>
  <section class="lap"><span class="felirat halv">Ranglista</span>
    ${r.length ? `<div class="tablaburok"><table><thead><tr><th>#</th><th>Csapat</th><th class="sz">Fejtörő + láda</th><th>Vádirat</th><th class="sz">Vádirat pont</th><th class="sz">Összesen</th><th></th></tr></thead><tbody>
    ${r.map((e, i) => `<tr><td><b>${i + 1}.</b></td><td><b>${esc(e.csapat)}</b><br><span class="kicsi halv kod" style="letter-spacing:.1em">${esc(e.kod)}</span></td><td class="sz">${e.pont}</td>
      <td class="kicsi">${G.vadirat.kerdesek.map((q, j) => `${e.reszl[j] ? "✓" : "✗"} ${esc(q.opciok[e.valasztasok[j]] ?? "?")}`).join("<br>")}</td><td class="sz">${e.vad}</td><td class="sz"><b style="font-size:20px">${e.ossz}</b></td>
      <td><button class="gomb halk" data-torol="${esc(e.kod)}">Törlés</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="halv">Még nincs beírt eredmény.</p>`}
  </section>`;
}

/* --- Kivetítő --- */
function kivetitoRajzol() {
  const k = $("#kivetito"); if (k.hidden) return;
  const m = perc(), r = ranglista();
  const kov = G.ladak.find(l => J.start && m < l.nyilik);
  k.innerHTML = `<button class="gomb masod bezar" data-act="kivetitoki">Bezárás</button>
    <div><span class="pecsetjel" style="display:inline-block;font-family:var(--f-type);font-weight:700;letter-spacing:.2em;color:var(--stamp);border:2px solid var(--stamp);padding:4px 10px;transform:rotate(-2deg);background:var(--paper)">ÜGYIRAT</span><h1 style="margin-top:14px">${esc(G.cim)}</h1><p class="k-nagy" style="color:var(--bg-muted)">${esc(G.alcim)}</p></div>
    ${J.bejelentes ? `<p class="k-bejel">${esc(J.bejelentes)}</p>` : ""}
    <div><div class="k-cimke">Hátralévő idő</div><div class="nagyora" data-khatra>${J.start ? hatra(G.idotartam) : ido(G.idotartam) + ":00"}</div></div>
    <div class="k-racs">
      ${J.start && m < 25 ? `<div><div class="k-cimke">Csatlakozás — szkenneljétek be</div><div class="sor" style="gap:24px;align-items:center;margin-top:8px"><div style="background:#fff;padding:12px;border-radius:10px" data-qr="${esc(appCim(inditokod(J.start)))}" data-meret="260"></div><div><div class="k-cimke">vagy indítókód</div><div class="k-kod">${inditokod(J.start)}</div></div></div></div>` : ""}
      ${kov ? `<div><div class="k-cimke">Következő láda</div><div class="k-nagy">${esc(kov.nev)}</div><div class="nagyora" style="font-size:clamp(48px,6vw,96px);color:var(--bg-ink)" data-kkov="${kov.nyilik}">${hatra(kov.nyilik)}</div></div>` : ""}
    </div>
    ${r.length ? `<div><div class="k-cimke">Állás</div><table><tbody>${r.map((e, i) => `<tr><td style="color:var(--hl);font-family:var(--f-type)">${i + 1}.</td><td>${esc(e.csapat)}</td><td style="text-align:right;font-family:var(--f-type)"><b>${e.ossz}</b></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  qrRajzol(k);
}

/* ---------------- Események ---------------- */
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "belep") {
    const id = $("#ugy").value, jelszo = $("#jelszo").value, h = $("#belepHiba");
    h.hidden = true;
    const gomb = e.target.querySelector("button"); gomb.disabled = true; gomb.textContent = "Megnyitás…";
    try { P = await ugyFajl(LISTA.find(u => u.id === id) || { id }); }
    catch (er) { h.hidden = false; h.textContent = "Az ügyet nem sikerült betölteni."; gomb.disabled = false; gomb.textContent = "Megnyitás"; return; }
    const g = await visszafejt(P.jm, jelszo, P.jm.so, ITER_JM);
    gomb.disabled = false; gomb.textContent = "Megnyitás";
    if (!g) { h.hidden = false; h.textContent = "Hibás jelszó."; return; }
    G = g; temaBeallit(G.tema);
    J = { start: null, bejelentes: "", eredmenyek: [], ...tarolo.get(jmKulcs(), {}) };
    try { sessionStorage.setItem("nyi-jm-aktiv", JSON.stringify({ id, jelszo })); } catch (er) {}
    rajzol(); return;
  }
  if (e.target.id === "bejelentes") { J.bejelentes = $("#bejelSzoveg").value.trim(); ment(); rajzol(); kivetitoRajzol(); return; }
  if (e.target.id === "eredmenyUrlap") {
    const nev = $("#eCsapat").value.trim(), kod = $("#eKod").value.trim(), h = $("#eHiba");
    const o = eredmenyKodOlvas(kod, G.id);
    if (!nev) { h.hidden = false; h.textContent = "Írd be a csapat nevét."; return; }
    if (!o) { h.hidden = false; h.textContent = "Ez a kód nem érvényes ehhez az ügyhöz. Ellenőrizd a betűket (nincs benne 0, O, 1 és I)."; return; }
    const norm = kod.toUpperCase().replace(/[^0-9A-Z]/g, ""); const szep = norm.slice(0, 3) + "-" + norm.slice(3);
    J.eredmenyek = (J.eredmenyek || []).filter(x => x.kod !== szep);
    J.eredmenyek.push({ csapat: nev, kod: szep, pont: o.pont, valasztasok: o.valasztasok });
    ment(); rajzol(); kivetitoRajzol(); return;
  }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.ful) { ful = d.ful; rajzol(); return; }
  if (d.nyomresz) { nyomResz = d.nyomresz; rajzol(); return; }
  if (d.torol) { J.eredmenyek = J.eredmenyek.filter(x => x.kod !== d.torol); ment(); rajzol(); kivetitoRajzol(); return; }
  switch (d.act) {
    case "indit": J.start = Date.now(); J.start -= J.start % 60000; ment(); rajzol(); return;   // egész percre kerekítve, hogy az indítókód pontos legyen
    case "nullaz":
      if (t.dataset.megerosit) { J.start = null; ment(); rajzol(); return; }
      t.dataset.megerosit = "1"; t.textContent = "Biztosan? Kattints újra a nullázáshoz"; setTimeout(() => { if (t.isConnected) { delete t.dataset.megerosit; t.textContent = "Óra nullázása"; } }, 4000); return;
    case "bejeltorol": J.bejelentes = ""; ment(); rajzol(); kivetitoRajzol(); return;
    case "kivetito": $("#kivetito").hidden = false; kivetitoRajzol(); document.documentElement.requestFullscreen?.().catch(() => {}); return;
    case "kivetitoki": $("#kivetito").hidden = true; if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); return;
    case "nyomtat": window.print(); return;
    case "kilep": G = null; J = null; P = null; try { sessionStorage.removeItem("nyi-jm-aktiv"); } catch (er) {} temaBeallit("noir1920"); rajzol(); return;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "csapatDb") { csapatDb = Math.max(1, Math.min(12, +e.target.value || 1)); rajzol(); }
  if (e.target.id === "nyomDosszie") { nyomDosszie = e.target.checked; rajzol(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#kivetito").hidden) $("#kivetito").hidden = true; });

let utolsoKiv = "";
function ketyeg() {
  if (!G) return;
  const m = perc();
  const o = $("[data-ora]"); if (o && J.start) o.textContent = ido(m);
  const h = $("[data-hatra]"); if (h) h.textContent = hatra(G.idotartam);
  const kh = $("[data-khatra]"); if (kh && J.start) kh.textContent = hatra(G.idotartam);
  const kk = $("[data-kkov]"); if (kk) kk.textContent = hatra(+kk.dataset.kkov);
  // a kivetítőt csak akkor rajzoljuk újra, ha valami lényeges változott (láda nyílt, indítókód eltűnt)
  const allapot = G.ladak.map(l => m >= l.nyilik).join("") + (m < 25);
  if (allapot !== utolsoKiv) { utolsoKiv = allapot; kivetitoRajzol(); if (ful === "vezerles" && !/INPUT/.test(document.activeElement?.tagName || "")) rajzol(); }
}

// Újratöltéskor (ugyanabban a böngészőlapban) ne kelljen újra jelszót írni
(async () => {
  await indul();
  try {
    const a = JSON.parse(sessionStorage.getItem("nyi-jm-aktiv") || "null");
    if (a && LISTA.some(u => u.id === a.id)) {
      P = await ugyFajl(LISTA.find(u => u.id === a.id));
      const g = await visszafejt(P.jm, a.jelszo, P.jm.so, ITER_JM);
      if (g) { G = g; temaBeallit(G.tema); J = { start: null, bejelentes: "", eredmenyek: [], ...tarolo.get(jmKulcs(), {}) }; rajzol(); }
    }
  } catch (e) {}
})();
</script>
</body>
</html>
